const emptyLog = () => ({ steps: 0, water: 0, foods: [], cardio: [], bio: {}, done: [], bp: [] });

function sanitizeLog(l) {
  const out = emptyLog();
  if (!l || typeof l !== 'object') return out;
  out.steps = Math.max(0, Math.round(num(l.steps)));
  out.water = Math.max(0, Math.round(num(l.water)));
  out.foods = (Array.isArray(l.foods) ? l.foods : []).filter((f) => f && f.name && !isNonVeg(f.name)).map((f) => ({
    id: String(f.id || uid()), fid: String(f.fid || ''), name: String(f.name).slice(0, 80), serving: String(f.serving || '1 serving').slice(0, 60),
    meal: MEALS.some((m) => m.id === f.meal) ? f.meal : 'snack', qty: Math.max(0, num(f.qty, 1)),
    kcal: Math.max(0, num(f.kcal)), p: Math.max(0, num(f.p)), c: Math.max(0, num(f.c)), f: Math.max(0, num(f.f)), fib: Math.max(0, num(f.fib))
  }));
  out.cardio = (Array.isArray(l.cardio) ? l.cardio : []).filter((c) => c && ACTIVITIES[c.type]).map((c) => ({
    id: String(c.id || uid()), type: c.type, dur: Math.max(0, num(c.dur)), intensity: clamp(Math.round(num(c.intensity, 1)), 0, 2),
    kcal: Math.max(0, num(c.kcal)), manual: !!c.manual, notes: String(c.notes || '').slice(0, 200)
  }));
  const b = l.bio && typeof l.bio === 'object' ? l.bio : {};
  ['weight', 'waist', 'sleep', 'energy'].forEach((k) => { if (b[k] !== undefined && b[k] !== null && b[k] !== '' && Number.isFinite(num(b[k], NaN))) out.bio[k] = num(b[k]); });
  out.done = (Array.isArray(l.done) ? l.done : []).filter((x) => typeof x === 'string' && x.length <= 40).slice(0, 100);
  out.bp = (Array.isArray(l.bp) ? l.bp : []).map((x) => ({
    id: String((x && x.id) || uid()), slot: x && x.slot === 'evening' ? 'evening' : 'morning',
    time: x && /^\d{2}:\d{2}$/.test(x.time) ? x.time : (x && x.slot === 'evening' ? '20:00' : '07:30'),
    sys: Math.round(num(x && x.sys, NaN)), dia: Math.round(num(x && x.dia, NaN)),
    pulse: x && x.pulse !== null && x.pulse !== undefined && x.pulse !== '' ? Math.round(num(x.pulse, NaN)) : null,
    notes: String((x && x.notes) || '').slice(0, 120)
  })).filter((x) => x.sys >= 60 && x.sys <= 260 && x.dia >= 30 && x.dia <= 160 && x.sys > x.dia && (x.pulse === null || (x.pulse >= 30 && x.pulse <= 220))).slice(0, 20);
  return out;
}

function sanitizeState(s) {
  if (!s || typeof s !== 'object') throw new Error('Backup is not a valid object');
  if (s.schema && s.schema !== SCHEMA) throw new Error(`Unsupported schema "${s.schema}"`);
  if (!s.profile || typeof s.profile !== 'object') throw new Error('Backup is missing a profile');
  if (s.logs && typeof s.logs !== 'object') throw new Error('Backup logs are malformed');
  const d = defaultState();
  const p = { ...d.profile };
  Object.keys(p).forEach((k) => {
    if (s.profile[k] === undefined) return;
    if (typeof p[k] === 'number') p[k] = num(s.profile[k], p[k]);
    else if (typeof p[k] === 'boolean') p[k] = !!s.profile[k];
    else p[k] = String(s.profile[k]);
  });
  if (!LIFESTYLES[p.lifestyle]) p.lifestyle = 'sedentary';
  if (!['male', 'female'].includes(p.gender)) p.gender = 'male';

  if (!isDateKey(p.startDate)) p.startDate = todayStr();
  const logs = {};

const getLog = (d) => state.logs[d] || emptyLog();

/* ---------- Science Engine ---------- */
function latestWeightEntry(upTo) {
  const keys = Object.keys(state.logs).filter((k) => state.logs[k].bio && state.logs[k].bio.weight > 0 && (!upTo || k <= upTo)).sort();
  if (!keys.length) return null;
  const k = keys[keys.length - 1];
  return { date: k, weight: state.logs[k].bio.weight };
}
function weightAt(date) { const e = latestWeightEntry(date); return e ? e.weight : (state.profile.currentWeight || state.profile.startWeight || 70); }
function bmrFor(w) { const p = state.profile; return 10 * w + 6.25 * p.height - 5 * p.age + (p.gender === 'female' ? -161 : 5); }
function strideCm() { return state.profile.height * (state.profile.gender === 'female' ? 0.413 : 0.415); }
// ACSM walking equation: net cost of level walking is about 0.5 kcal per kg per km.
const stepKcal = (steps, w) => steps * strideCm() / 100000 * 0.5 * w;
const sessionKcal = (c, w) => (c.manual ? c.kcal : metKcal(c.type, c.intensity, c.dur, w));
const minCalories = () => state.profile.gender === 'female' ? 1200 : 1500;

function targets(ownOnly = false) {
  const p = state.profile;
  const ct = ownOnly ? {} : coachTargets();
  const w = p.currentWeight || p.startWeight;
  const bmr = bmrFor(w);
  const tdee = bmr * (LIFESTYLES[p.lifestyle] || LIFESTYLES.sedentary).factor;
  const plannedDeficit = p.weeklyRate * KCAL_PER_KG / 7;
  let kcal = tdee - plannedDeficit;
  const floored = kcal < minCalories();
  kcal = Math.max(minCalories(), kcal);
  const proteinMin = 1.2 * p.targetWeight, proteinMax = 1.6 * p.targetWeight;
  let protein = 1.4 * p.targetWeight;
  let fat = kcal * 0.27 / 9;
  let carbs = Math.max(50, (kcal - protein * 4 - fat * 9) / 4);
  if (p.customTargets) { kcal = p.customCalories; protein = p.customProtein; carbs = p.customCarbs; fat = p.customFat; }
  let pMin = proteinMin, pMax = proteinMax;
  if (ct.calories) { kcal = ct.calories; fat = kcal * 0.27 / 9; carbs = Math.max(50, (kcal - protein * 4 - fat * 9) / 4); }
  if (ct.protein) { protein = ct.protein; pMin = ct.protein; pMax = Math.max(proteinMax, ct.protein); carbs = Math.max(50, (kcal - protein * 4 - fat * 9) / 4); }
  const fiber = Math.max(25, kcal / 1000 * 14);
  const water = ct.water || (p.waterAuto ? clamp(Math.round(w * 30 / 250) * 250, 2000, 4000) : p.waterGoal);
  const effectiveDeficit = tdee - kcal;
  const src = { steps: ct.steps ? 'coach' : 'you', cardio: ct.cardio ? 'coach' : 'you', water: ct.water ? 'coach' : 'you', calories: ct.calories ? 'coach' : 'you', protein: ct.protein ? 'coach' : 'you' };
  return { bmr, tdee, plannedDeficit, effectiveDeficit, kcal, floored: floored && !ct.calories, protein, proteinMin: pMin, proteinMax: pMax, fat, carbs, fiber, water, steps: ct.steps || p.stepGoal, cardio: ct.cardio ?? p.cardioGoal, src };
}
const targetsOwn = () => targets(true);

function bmiInfo(w = state.profile.currentWeight) {
  const h = state.profile.height / 100;
  const bmi = w / (h * h);
  const who = bmi < 18.5 ? ['Underweight', 'amber'] : bmi < 25 ? ['Normal', 'green'] : bmi < 30 ? ['Overweight', 'amber'] : ['Obese', 'red'];
  const asian = bmi < 18.5 ? ['Underweight', 'amber'] : bmi < 23 ? ['Normal', 'green'] : bmi < 25 ? ['Overweight', 'amber'] : ['Obese', 'red'];
  return { bmi, who, asian };
}

function daySummary(date) {
  const l = getLog(date);
  const w = weightAt(date);
  const bmr = bmrFor(w);
  const intake = sum(l.foods, (f) => f.kcal * f.qty);
  const p = sum(l.foods, (f) => f.p * f.qty), c = sum(l.foods, (f) => f.c * f.qty), f = sum(l.foods, (x) => x.f * x.qty), fib = sum(l.foods, (x) => x.fib * x.qty);
  const sKcal = stepKcal(l.steps, w);
  // A walk or run logged as cardio is usually also counted by the phone's step counter. Remove the
  // calories of those overlapping steps from the session so the same movement is not counted twice.
  let stepsLeft = l.steps, overlapSteps = 0, cKcal = 0, mvpaMin = 0;
  l.cardio.forEach((x) => {
    let k = sessionKcal(x, w);
    const cad = (ACTIVITIES[x.type] || {}).cadence;
    if (cad && stepsLeft > 0) { const ov = Math.min(stepsLeft, cad * x.dur); stepsLeft -= ov; overlapSteps += ov; k = Math.max(0, k - stepKcal(ov, w)); }
    cKcal += k;
    mvpaMin += x.dur * mvpaFactor(metOf(x.type, x.intensity));
  });
  const cMin = sum(l.cardio, (x) => x.dur);
  const tef = intake * 0.1; // thermic effect of food, about 10% of energy intake
  const burnt = bmr + tef + sKcal + cKcal;
  let bmrSoFar = bmr;
  if (date === todayStr()) { const n = new Date(); bmrSoFar = bmr * ((n.getHours() * 60 + n.getMinutes()) / 1440); }
  return {
    date, log: l, weight: w, bmr, bmrSoFar, intake, p, c, f, fib, stepKcal: sKcal, cardioKcal: cKcal, cardioMin: cMin, mvpaMin, overlapSteps, tef, burnt,
    deficit: burnt - intake, steps: l.steps, water: l.water, distance: l.steps * strideCm() / 100000,
    hasFood: l.foods.length > 0, hasAny: l.foods.length > 0 || l.steps > 0 || l.water > 0 || l.cardio.length > 0 || (l.bp || []).length > 0
  };
}

function streak() {
  let d = todayStr(), n = 0;
  if (!daySummary(d).hasAny) d = addDays(d, -1);
  while (daySummary(d).hasAny) { n++; d = addDays(d, -1); if (n > 3650) break; }
  return n;
}

function linSlope(points) { // points: [{x, y}] → slope per x unit
  const n = points.length; if (n < 2) return 0;
  const mx = sum(points, (p) => p.x) / n, my = sum(points, (p) => p.y) / n;
  const den = sum(points, (p) => (p.x - mx) ** 2);
  return den ? sum(points, (p) => (p.x - mx) * (p.y - my)) / den : 0;
}

function weightTrend(endDate, days = 14) {
  const start = addDays(endDate, -(days - 1));
  const pts = dateRange(endDate, days).map((d) => ({ d, w: getLog(d).bio.weight })).filter((x) => x.w > 0).map((x) => ({ x: daysBetween(start, x.d), y: x.w, d: x.d }));
  const slope = linSlope(pts);
  const foodDays = dateRange(endDate, days).map(daySummary).filter((s) => s.hasFood);
  const avgDeficit = foodDays.length ? sum(foodDays, (s) => s.deficit) / foodDays.length : 0;
  return { points: pts, weeklyChange: slope * 7, expectedWeekly: -(avgDeficit * 7 / KCAL_PER_KG), avgDeficit, foodDays: foodDays.length, span: pts.length >= 2 ? pts[pts.length - 1].x - pts[0].x : 0 };
}

function projection() {
  const p = state.profile;
  const remaining = Math.max(0, p.currentWeight - p.targetWeight);
  const tr = weightTrend(todayStr(), 14);
  let perDay = 0, basis = 'your target weekly rate';
  if (tr.points.length >= 3 && tr.span >= 7 && tr.weeklyChange < -0.05) { perDay = -tr.weeklyChange / 7; basis = 'your actual 14-day weight trend'; }
  else if (p.trackFood !== false && tr.foodDays >= 5 && tr.avgDeficit > 50) { perDay = tr.avgDeficit / KCAL_PER_KG; basis = 'your 14-day average deficit'; }
  if (!perDay) perDay = p.weeklyRate / 7;
  const daysNeeded = remaining > 0 ? Math.ceil(remaining / perDay) : 0;
  const planDays = remaining > 0 ? Math.ceil(remaining / (p.weeklyRate / 7)) : 0;
  return {
    remaining, perDay, basis, daysNeeded,
    date: remaining > 0 ? addDays(todayStr(), daysNeeded) : todayStr(),
    planDate: remaining > 0 ? addDays(todayStr(), planDays) : todayStr(),
    lost: p.startWeight - p.currentWeight,
    pct: p.startWeight > p.targetWeight ? clamp((p.startWeight - p.currentWeight) / (p.startWeight - p.targetWeight), 0, 1) : (remaining === 0 ? 1 : 0)
  };
}

/* ---------- Scope of Improvement: Smart Diagnostic Engine ---------- */
const PROTEIN_FIXES = ['soya_chunks', 'lowfat_paneer', 'whey', 'greek_yogurt', 'tofu', 'plant_protein', 'moong_chilla', 'sprouts', 'roasted_chana'];

    let st, head, det;

    else if ((b.sleep ?? 7) >= 7 && (b.sleep ?? 7) <= 9 && (b.energy ?? 4) >= 3) { st = 'green'; head = `Well recovered${b.sleep !== undefined ? ` • ${b.sleep} h sleep` : ''}`; det = 'Good sleep and energy support hormones (leptin/ghrelin) that drive hunger control.'; }
    else if ((b.sleep ?? 7) < 6 || (b.energy ?? 3) <= 2) { st = 'red'; head = 'Poor recovery'; det = `Sleep ${b.sleep ?? '-'} h, energy ${b.energy ?? '-'}/5. Short sleep raises hunger by up to 20%. Prioritise a 7-hour window and keep today's training light.`; }
    else { st = 'amber'; head = 'Recovery could improve'; det = `Sleep ${b.sleep ?? '-'} h, energy ${b.energy ?? '-'}/5. Adults need 7–9 hours (AASM). Limit screens 45 min before bed.`; }
    pts.recovery = (b.sleep !== undefined ? (b.sleep >= 7 && b.sleep <= 9 ? 3 : b.sleep >= 6 ? 2 : 1) : 0) + (b.energy !== undefined ? b.energy / 5 * 2 : 0);
    audits.push({ key: 'recovery', title: 'Sleep & Recovery', icon: 'fa-bed', color: '#6366F1', st, head, det, metric: `${b.sleep ?? '-'} h • ${b.energy ?? '-'}/5`, pct: b.sleep !== undefined ? clamp(b.sleep / 8, 0, 1) : 0 });
  }

  audits.push(bpAudit(date)); // informational only: blood pressure is not part of the Fitness Score

  // When food is not tracked, calories (25) and protein (20) are excluded and the rest is rescaled to 100.
  const raw = sum(Object.values(pts));
  const score = Math.round(clamp(foodOn ? raw : raw / 55 * 100, 0, 100));
  return { date, score, audits, pts, summary: s, targets: t, foodOn };
}

function scoreGrade(score) {
  if (score >= 85) return { label: 'Elite', color: '#10B981', cls: 'pill-green' };
  if (score >= 70) return { label: 'Strong', color: '#22C55E', cls: 'pill-green' };
  if (score >= 50) return { label: 'Building', color: '#F59E0B', cls: 'pill-amber' };
  if (score >= 30) return { label: 'Needs Work', color: '#F97316', cls: 'pill-amber' };
  return { label: 'Getting Started', color: '#F43F5E', cls: 'pill-red' };
}

/* ---------- Meal plan builder ---------- */
function planTargetKcal() { const c = state.settings.planner.calories; return c === 'auto' ? Math.round(targets().kcal) : num(c, 1800); }
function buildPlan(templateId, targetKcal, swaps = {}) {
  const tpl = PLAN_TEMPLATES.find((x) => x.id === templateId) || PLAN_TEMPLATES[0];
  const base = MEALS.map((m) => {
    const options = tpl.meals[m.id] || [];
    const idx = options.length ? ((swaps[m.id] || 0) % options.length) : 0;
    const items = (options[idx] || []).map(([fid, qty]) => ({ food: findFood(fid), qty })).filter((x) => x.food && x.qty > 0);
    return { meal: m, idx, count: options.length, items };
  });
  const baseKcal = sum(base, (m) => sum(m.items, (i) => i.food.kcal * i.qty));
  const factor = baseKcal ? targetKcal / baseKcal : 1;
  base.forEach((m) => m.items.forEach((i) => { i.qty = Math.max(0.5, Math.round(i.qty * factor * 2) / 2); }));
  // Greedy correction: half-serving rounding can drift; nudge energy-dense, non-protein items until within ±5% of target.
  const all = base.flatMap((m) => m.items);
  const total = () => sum(all, (i) => i.food.kcal * i.qty);
  const flexible = all.filter((i) => i.food.cat !== 'Protein');
  for (let guard = 0; guard < 40; guard++) {
    const kc = total();
    if (kc > targetKcal * 1.05) {
      const pick = flexible.filter((i) => i.qty > 0.5).sort((x, y) => y.food.kcal * y.qty - x.food.kcal * x.qty)[0];
      if (!pick) break; pick.qty -= 0.5;
    } else if (kc < targetKcal * 0.95) {
      const pick = flexible.filter((i) => ['Grains', 'Dals & Legumes', 'Breakfast', 'Fruits', 'Dairy & Alternatives'].includes(i.food.cat)).sort((x, y) => x.qty - y.qty)[0];
      if (!pick) break; pick.qty += 0.5;
    } else break;
  }
  base.forEach((m) => {
    m.kcal = sum(m.items, (i) => i.food.kcal * i.qty); m.p = sum(m.items, (i) => i.food.p * i.qty);
    m.c = sum(m.items, (i) => i.food.c * i.qty); m.f = sum(m.items, (i) => i.food.f * i.qty); m.fib = sum(m.items, (i) => i.food.fib * i.qty);
  });
  return { tpl, meals: base, factor, kcal: sum(base, (m) => m.kcal), p: sum(base, (m) => m.p), c: sum(base, (m) => m.c), f: sum(base, (m) => m.f), fib: sum(base, (m) => m.fib) };
}

function drawDashboardCharts() {
  const days = dateRange(ui.date, ui.chartRange);
  const labels = days.map((d) => fmtDate(d));
  const p = state.profile, t = targets();
  const cc = chartColors();
  const weights = days.map((d) => getLog(d).bio.weight || null);
  const traj = days.map((d) => {
    const n = daysBetween(p.startDate, d);
    if (n < 0) return null;
    return r2(Math.max(p.targetWeight, p.startWeight - p.weeklyRate * n / 7));
  });
  const valid = weights.filter(Boolean).concat(traj.filter((x) => x !== null));
  const minW = valid.length ? Math.min(...valid) : p.targetWeight;
  const maxW = valid.length ? Math.max(...valid) : p.startWeight;
  const showGoal = minW - p.targetWeight <= 3;
  mkChart('chWeight', {
    type: 'line',
    data: { labels, datasets: [
      { label: 'Actual weight (kg)', data: weights, borderColor: '#8B5CF6', backgroundColor: 'rgba(139,92,246,0.12)', fill: 'start', tension: 0.35, spanGaps: true, pointRadius: 4, pointBackgroundColor: '#8B5CF6', pointBorderColor: cc.bg, pointBorderWidth: 2, borderWidth: 2.5 },
      { label: 'Target trajectory', data: traj, borderColor: '#F59E0B', borderDash: [6, 5], pointRadius: 0, tension: 0, borderWidth: 2, fill: false },
      ...(showGoal ? [{ label: 'Goal weight', data: days.map(() => p.targetWeight), borderColor: 'rgba(16,185,129,0.6)', borderDash: [2, 4], pointRadius: 0, borderWidth: 1.5, fill: false }] : [])
    ] },
    options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, usePointStyle: true, color: cc.text } }, tooltip: { callbacks: { label: (c) => c.raw === null ? null : `${c.dataset.label}: ${c.raw} kg` } } },
      scales: { ...baseScales(''), y: { ...baseScales('').y, suggestedMin: Math.floor(minW - 0.5), suggestedMax: Math.ceil(maxW + 0.5) } } }
  });
  const sums = days.map(daySummary);
  mkChart('chCalories', {
    type: 'bar',
    data: { labels, datasets: [
      { type: 'line', label: 'Target intake', data: days.map(() => Math.round(t.kcal)), borderColor: '#F59E0B', borderDash: [6, 5], borderWidth: 2, pointRadius: 0, order: 0 },
      { label: 'Calories consumed', data: sums.map((s) => Math.round(s.intake)), backgroundColor: '#10B981', borderRadius: 6, maxBarThickness: 22, order: 1 },
      { label: 'Calories burnt', data: sums.map((s) => Math.round(s.burnt)), backgroundColor: '#F43F5E', borderRadius: 6, maxBarThickness: 22, order: 2 }
    ] },
    options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, usePointStyle: true, color: cc.text } },
        tooltip: { callbacks: { footer: (items) => { const s = sums[items[0].dataIndex]; return s.hasFood ? `Net: ${s.deficit >= 0 ? '−' : '+'}${fmt(Math.abs(s.deficit))} kcal` : 'No food logged'; } } } },
      scales: baseScales('kcal') }
  });
  const s = daySummary(ui.date);
  const hasMacros = s.p + s.c + s.f + s.fib > 0;
  mkChart('chMacro', {
    type: 'doughnut',
    data: { labels: ['Protein', 'Carbs', 'Fats', 'Fiber'], datasets: [{ data: hasMacros ? [r1(s.p), r1(s.c), r1(s.f), r1(s.fib)] : [1, 1, 1, 1], backgroundColor: hasMacros ? ['#8B5CF6', '#F59E0B', '#F43F5E', '#10B981'] : ['rgba(161,161,170,.18)', 'rgba(161,161,170,.14)', 'rgba(161,161,170,.10)', 'rgba(161,161,170,.06)'], borderColor: cc.bg, borderWidth: 3, hoverOffset: 6 }] },
    options: { responsive: true, maintainAspectRatio: false, cutout: '70%', plugins: { legend: { display: false }, tooltip: { enabled: hasMacros, callbacks: { label: (c) => `${c.label}: ${c.raw} g` } } } }
  });
}

/* ---------- Quick actions ---------- */
function addSteps(n) {
  const l = ensureLog(ui.date); l.steps = Math.max(0, l.steps + Math.round(n)); pruneLog(ui.date);
  refresh(); toast(`${n >= 0 ? '+' : ''}${fmt(n)} steps logged`);
}
function addCustomSteps() { const v = Math.round(num($('stepsCustom').value)); if (!v) return toast('Enter a step count', 'warn'); addSteps(v); }
function setStepsExact() {
  const v = Math.round(num($('stepsCustom') ? $('stepsCustom').value : NaN, NaN));
  if (!Number.isFinite(v) || v < 0) return toast('Type the exact total in the box, then press the pencil', 'info');
  const l = ensureLog(ui.date); l.steps = v; pruneLog(ui.date); refresh(); toast(`Steps set to ${fmt(v)}`);
}
function addWater(ml) {
  const l = ensureLog(ui.date); const before = l.water; l.water = Math.max(0, l.water + ml); pruneLog(ui.date);
  refresh(); if (before !== l.water) toast(ml > 0 ? `+${ml} ml water 💧` : `${ml} ml removed`, ml > 0 ? 'success' : 'info');
}
function setWater(ml) { const l = ensureLog(ui.date); l.water = l.water === ml ? ml - 250 : ml; pruneLog(ui.date); refresh(); }
function logWeight(date, w) {
  if (!(w >= 25 && w <= 350)) { toast('Enter a realistic weight between 25 and 350 kg', 'warn'); return false; }
  const l = ensureLog(date); l.bio.weight = r1(w);
  const latest = latestWeightEntry();
  if (latest && latest.date === date) state.profile.currentWeight = r1(w);
  return true;
}
function quickWeight() { const w = num($('dashWeight').value, NaN); if (logWeight(ui.date, w)) { refresh(); toast(`Weight ${r1(w)} kg saved for ${fmtDate(ui.date)}`); } }

          </div>
        </div>
      </div>

      <div class="space-y-5">

        <div class="card card-pad" data-tour="cardio">
          <div class="h-title"><i class="fa-solid fa-heart-pulse mr-1 text-rose-500"></i>Cardio &amp; Workout Logger</div>
          <div class="text-xs muted">Active calories (net of resting) from MET values for your weight (${r1(s.weight)} kg). Walks and runs your step counter already counted are not double-counted.</div>
          <div class="mt-3 space-y-3">
            <div><label class="label">Activity</label><select id="cdType" class="input" onchange="ui.cardioType=this.value;updateCardioPreview()">${Object.entries(ACTIVITIES).map(([k, a]) => `<option value="${k}" ${ui.cardioType === k ? 'selected' : ''}>${a.name}</option>`).join('')}</select></div>
            <div class="grid grid-cols-2 gap-2">
              <div><label class="label">Duration (min)</label><input id="cdDur" type="number" min="1" class="input" value="${ui.cardioDur || 30}" oninput="ui.cardioDur=this.value;updateCardioPreview()"></div>
              <div><label class="label">Calories</label><div id="cdAuto" class="input !bg-rose-50 font-bold text-rose-600 dark:!bg-rose-400/10 dark:text-rose-300">-</div></div>
            </div>
            <div><label class="label">Intensity</label><div class="grid grid-cols-3 gap-1.5">${INTENSITIES.map((n, i) => `<button class="chip !rounded-lg !py-1.5 ${ui.cardioIntensity === i ? 'active' : ''}" onclick="ui.cardioIntensity=${i};document.querySelectorAll('[data-int]').forEach(b=>b.classList.toggle('active',+b.dataset.int===${i}));updateCardioPreview()" data-int="${i}">${n}</button>`).join('')}</div></div>
            <label class="flex items-center gap-2 text-sm font-semibold"><input id="cdManual" type="checkbox" class="h-4 w-4 accent-amber-500" onchange="$('cdKcal').classList.toggle('hidden',!this.checked)"> Manual calorie override</label>

          <div class="mt-4 space-y-2">${getLog(ui.date).cardio.map((c) => `
            <div class="flex items-center gap-3 rounded-xl bg-rose-50/70 p-2.5 dark:bg-rose-400/[.06]">
              <span class="flex h-9 w-9 items-center justify-center rounded-lg bg-white text-rose-500 dark:bg-white/5"><i class="fa-solid ${ACTIVITIES[c.type].icon}"></i></span>
              <div class="min-w-0 flex-1"><div class="truncate text-sm font-bold">${ACTIVITIES[c.type].name}</div><div class="truncate text-[11px] muted">${c.dur} min • ${INTENSITIES[c.intensity]} • <b class="text-rose-500">${fmt(sessionKcal(c, weightAt(ui.date)))} active kcal</b>${c.manual ? ' (manual)' : ''}${c.notes ? ' • ' + esc(c.notes) : ''}</div></div>
              <button class="btn btn-ghost btn-sm !px-1.5 text-rose-500" onclick="removeCardio('${c.id}')" aria-label="Remove session"><i class="fa-solid fa-trash-can"></i></button>
            </div>`).join('') || '<div class="rounded-xl border border-dashed border-amber-200 p-3 text-center text-xs muted dark:border-white/10">No sessions logged for this day</div>'}
          </div>
        </div>

        <!-- Biometrics -->
        <div class="card card-pad">
          <div class="h-title"><i class="fa-solid fa-weight-scale mr-1 text-violet-500"></i>Daily Biometric Check-in</div>
          <div class="text-xs muted">Best logged in the morning, after waking</div>
          <div class="mt-3 grid grid-cols-2 gap-2">
            <div><label class="label">Weight (kg)</label><input id="bioWeight" type="number" step="0.1" class="input" value="${b.weight ?? ''}" placeholder="${r1(weightAt(ui.date))}"></div>
            <div><label class="label">Waist (cm)</label><input id="bioWaist" type="number" step="0.5" class="input" value="${b.waist ?? ''}" placeholder="e.g. 92"></div>
            <div class="col-span-2"><label class="label">Sleep (hours)</label><input id="bioSleep" type="number" step="0.25" min="0" max="16" class="input" value="${b.sleep ?? ''}" placeholder="e.g. 7.5"></div>
          </div>
          <label class="label mt-3">Energy level</label>
          <div class="grid grid-cols-5 gap-1.5">${[['😫', 1], ['😕', 2], ['🙂', 3], ['😃', 4], ['🔥', 5]].map(([e, v]) => `<button data-energy="${v}" class="rounded-xl border py-2 text-lg transition ${ui.bioEnergy === v ? 'border-amber-400 bg-amber-100 dark:bg-amber-400/15' : 'border-amber-100 dark:border-white/10'}" onclick="ui.bioEnergy=(ui.bioEnergy===${v}?undefined:${v});document.querySelectorAll('[data-energy]').forEach(x=>{const on=+x.dataset.energy===ui.bioEnergy;x.classList.toggle('border-amber-400',on);x.classList.toggle('bg-amber-100',on)})" title="Energy ${v}/5">${e}<div class="text-[10px] font-bold muted">${v}</div></button>`).join('')}</div>
          <button class="btn mt-3 w-full bg-violet-500 text-white shadow-md shadow-violet-500/25 hover:bg-violet-600" onclick="saveBio()"><i class="fa-solid fa-floppy-disk"></i>Save Check-in</button>
        </div>

        <!-- Activity snapshot -->
        <div class="card card-pad">
          <div class="h-title"><i class="fa-solid fa-shoe-prints mr-1 text-amber-500"></i>Steps &amp; Water (exact)</div>
          <div class="mt-3 grid grid-cols-2 gap-2">
            <div><label class="label">Steps</label><input id="trSteps" type="number" min="0" class="input" value="${s.steps || ''}" placeholder="0"></div>
            <div><label class="label">Water (ml)</label><input id="trWater" type="number" min="0" step="50" class="input" value="${s.water || ''}" placeholder="0"></div>
          </div>
          <div class="mt-2 text-[11px] muted">${r2(s.distance)} km • ${fmt(s.stepKcal)} kcal from steps • stride ${r1(strideCm())} cm</div>
          <button class="btn btn-soft mt-3 w-full" onclick="saveExactActivity()"><i class="fa-solid fa-check"></i>Update Totals</button>
        </div>

  renderFoodResults();
  updateCardioPreview();
}

function filteredFoods() {
  const q = ui.foodQuery.trim().toLowerCase();
  return allFoods().filter((f) => {
    if (ui.foodCat === 'Jain' && !f.tags.includes('j')) return false;
    if (ui.foodCat === 'Low-GI' && !f.tags.includes('lg')) return false;
    if (ui.foodCat === 'Custom' && f.builtin) return false;
    if (!['All', 'Jain', 'Low-GI', 'Custom'].includes(ui.foodCat) && f.cat !== ui.foodCat) return false;
    if (!q) return true;
    return q.split(/\s+/).every((w) => (f.name + ' ' + f.cat + ' ' + f.serving).toLowerCase().includes(w));
  });
}

function renderFoodResults() {
  const el = $('foodResults'); if (!el) return;
  const list = filteredFoods();
  el.innerHTML = list.length ? list.map((f) => `
    <div class="flex items-center gap-3 px-3 py-2 hover:bg-amber-50/70 dark:hover:bg-white/[.03]">
      <div class="min-w-0 flex-1">
        <div class="truncate text-sm font-semibold">${esc(f.name)} ${f.tags.includes('j') ? '<span class="pill pill-violet !px-1.5 !py-0 !text-[9px]">Jain</span>' : ''}${f.tags.includes('lg') ? '<span class="pill pill-green !px-1.5 !py-0 !text-[9px]">Low-GI</span>' : ''}${!f.builtin ? '<span class="pill pill-amber !px-1.5 !py-0 !text-[9px]">Custom</span>' : ''}${state.profile.dietType === 'jain' && f.builtin && !f.tags.includes('j') ? '<span class="pill pill-red !px-1.5 !py-0 !text-[9px]">Not Jain</span>' : ''}</div>
        <div class="truncate text-[11px] muted">${esc(f.serving)} • <b class="text-emerald-600 dark:text-emerald-400">${fmt(f.kcal)} kcal</b> • P ${r1(f.p)}g • C ${r1(f.c)}g • F ${r1(f.f)}g • Fib ${r1(f.fib)}g</div>
      </div>
      ${!f.builtin ? `<button class="btn btn-ghost btn-sm !px-1.5" onclick="openCustomFood('${f.id}')" aria-label="Edit custom food"><i class="fa-solid fa-pen"></i></button><button class="btn btn-ghost btn-sm !px-1.5 text-rose-500" onclick="deleteCustomFood('${f.id}')" aria-label="Delete custom food"><i class="fa-solid fa-trash-can"></i></button>` : ''}
      <button class="btn btn-primary btn-sm !px-2.5" onclick="addFood('${f.id}')" aria-label="Add ${esc(f.name)}"><i class="fa-solid fa-plus"></i></button>
    </div>`).join('') : `<div class="p-6 text-center text-sm muted">No vegetarian match for "${esc(ui.foodQuery)}". <button class="font-semibold text-amber-600 underline" onclick="openCustomFood()">Create a custom food</button></div>`;
}

function addFood(fid, meal = ui.foodMeal || defaultMeal(), qty = ui.foodQty, date = ui.date, silent = false) {
  const f = findFood(fid); if (!f) return;
  const l = ensureLog(date);
  const existing = l.foods.find((x) => x.fid === fid && x.meal === meal);
  if (existing) existing.qty = r2(existing.qty + qty);
  else l.foods.push({ id: uid(), fid: f.id, name: f.name, serving: f.serving, meal, qty: r2(qty), kcal: f.kcal, p: f.p, c: f.c, f: f.f, fib: f.fib });
  if (!silent) { refresh(); toast(`${f.name} ×${r2(qty)} added to ${mealName(meal)}`); }
}
function changeQty(id, d) {
  const l = ensureLog(ui.date); const f = l.foods.find((x) => x.id === id); if (!f) return;
  f.qty = r2(f.qty + d);
  if (f.qty <= 0) l.foods = l.foods.filter((x) => x.id !== id);
  pruneLog(ui.date); refresh();
}
function removeFood(id) { const l = ensureLog(ui.date); const f = l.foods.find((x) => x.id === id); l.foods = l.foods.filter((x) => x.id !== id); pruneLog(ui.date); refresh(); if (f) toast(`${f.name} removed`, 'info'); }

async function copyPreviousMeals() {
  let d = addDays(ui.date, -1), tries = 0;
  while (!getLog(d).foods.length && tries < 30) { d = addDays(d, -1); tries++; }
  const src = getLog(d).foods;
  if (!src.length) return toast('No meals found in the previous 30 days', 'warn');
  const ok = await confirmDialog({ title: 'Copy meals', message: `Copy ${src.length} food item(s) from <b>${fmtLong(d)}</b> into <b>${fmtLong(ui.date)}</b>? They'll be appended to any existing entries.`, confirmText: 'Copy meals' });
  if (!ok) return;
  const l = ensureLog(ui.date);
  src.forEach((f) => l.foods.push({ ...f, id: uid() }));
  refresh(); toast(`${src.length} items copied from ${fmtDate(d)}`);
}

function openCustomFood(id) {
  const f = id ? state.customFoods.find((x) => x.id === id) : null;
  const v = (k, d = '') => f ? esc(f[k]) : d;
  openModal(`<i class="fa-solid fa-seedling text-emerald-500"></i> ${f ? 'Edit' : 'Add'} Custom Pure Veg Food`, `
    <div class="mb-3 rounded-xl bg-emerald-50 p-3 text-xs text-emerald-800 dark:bg-emerald-400/10 dark:text-emerald-300"><i class="fa-solid fa-leaf"></i> MiyeeFit Pro is 100% vegetarian. Items containing meat, fish, poultry or eggs are rejected.</div>
    <div class="grid grid-cols-2 gap-3">
      <div class="col-span-2"><label class="label">Food name</label><input id="cfName" class="input" value="${v('name')}" placeholder="e.g. Homemade Paneer Paratha"></div>
      <div class="col-span-2"><label class="label">Serving description</label><input id="cfServing" class="input" value="${v('serving', '1 serving')}" placeholder="e.g. 1 piece (80g)"></div>
      <div><label class="label">Calories (kcal)</label><input id="cfKcal" type="number" min="0" class="input" value="${v('kcal')}"></div>
      <div><label class="label">Protein (g)</label><input id="cfP" type="number" min="0" step="0.1" class="input" value="${v('p')}"></div>
      <div><label class="label">Carbs (g)</label><input id="cfC" type="number" min="0" step="0.1" class="input" value="${v('c')}"></div>
      <div><label class="label">Fat (g)</label><input id="cfF" type="number" min="0" step="0.1" class="input" value="${v('f')}"></div>
      <div><label class="label">Fiber (g)</label><input id="cfFib" type="number" min="0" step="0.1" class="input" value="${v('fib')}"></div>
      <div class="flex items-end"><div id="cfCheck" class="text-[11px] muted">Macros will be cross-checked against calories.</div></div>
    </div>`,
    `<button class="btn btn-soft" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveCustomFood('${f ? f.id : ''}')"><i class="fa-solid fa-floppy-disk"></i>${f ? 'Update' : 'Save'} Food</button>`);
}
function saveCustomFood(id) {
  const name = $('cfName').value.trim();
  if (!name) return toast('Please enter a food name', 'warn');
  if (isNonVeg(name) || isNonVeg($('cfServing').value)) return toast('Only pure vegetarian foods are allowed: no meat, fish, poultry or eggs.', 'error');
  const item = { name: name.slice(0, 80), serving: ($('cfServing').value.trim() || '1 serving').slice(0, 60), kcal: Math.max(0, num($('cfKcal').value)), p: Math.max(0, num($('cfP').value)), c: Math.max(0, num($('cfC').value)), f: Math.max(0, num($('cfF').value)), fib: Math.max(0, num($('cfFib').value)), cat: 'Custom', tags: [], builtin: false };
  if (!item.kcal) return toast('Calories must be greater than 0', 'warn');
  const est = item.p * 4 + item.c * 4 + item.f * 9;
  if (est > item.kcal * 1.35 + 20) toast(`Heads-up: macros imply ~${fmt(est)} kcal, higher than ${fmt(item.kcal)} entered.`, 'warn');
  if (id) { const f = state.customFoods.find((x) => x.id === id); Object.assign(f, item); }
  else state.customFoods.push({ id: 'c_' + uid(), ...item });
  closeModal(); ui.foodCat = 'Custom'; ui.foodQuery = ''; refresh(); toast(`${item.name} saved to your custom foods`);
}
async function deleteCustomFood(id) {
  const f = state.customFoods.find((x) => x.id === id); if (!f) return;
  if (!(await confirmDialog({ title: 'Delete custom food', message: `Delete <b>${esc(f.name)}</b> from your custom foods? Existing log entries are kept.`, confirmText: 'Delete', danger: true }))) return;
  state.customFoods = state.customFoods.filter((x) => x.id !== id); refresh(); toast('Custom food deleted', 'info');
}

function updateCardioPreview() {
  const el = $('cdAuto'); if (!el) return;
  const dur = num($('cdDur').value);
  const kcal = metKcal(ui.cardioType, ui.cardioIntensity, dur, weightAt(ui.date));
  el.textContent = dur > 0 ? `${fmt(kcal)} kcal` : '-';
  el.title = `Active kcal = (MET ${ACTIVITIES[ui.cardioType].met[ui.cardioIntensity]} - 1) × 3.5 × ${r1(weightAt(ui.date))} kg ÷ 200 × ${dur} min`;
}
function addCardio() {
  const dur = num($('cdDur').value);
  if (!(dur > 0 && dur <= 600)) return toast('Enter a duration between 1 and 600 minutes', 'warn');
  const manual = $('cdManual').checked;
  const auto = metKcal(ui.cardioType, ui.cardioIntensity, dur, weightAt(ui.date));
  const kcal = manual ? num($('cdKcal').value, NaN) : auto;
  if (manual && !(kcal >= 0)) return toast('Enter the calories for manual override', 'warn');
  ensureLog(ui.date).cardio.push({ id: uid(), type: ui.cardioType, dur, intensity: ui.cardioIntensity, kcal: Math.round(kcal), manual, notes: $('cdNotes').value.trim().slice(0, 200) });
  ui.cardioDur = dur;
  refresh(); toast(`${ACTIVITIES[ui.cardioType].name}: ${dur} min • ${fmt(kcal)} kcal burnt 🔥`);
}
function removeCardio(id) { const l = ensureLog(ui.date); l.cardio = l.cardio.filter((x) => x.id !== id); pruneLog(ui.date); refresh(); toast('Session removed', 'info'); }

function saveBio() {
  const l = ensureLog(ui.date);
  const w = $('bioWeight').value.trim(), wa = $('bioWaist').value.trim(), sl = $('bioSleep').value.trim();
  if (w) { if (!logWeight(ui.date, num(w, NaN))) return; } else delete l.bio.weight;
  if (wa) { const v = num(wa, NaN); if (!(v >= 40 && v <= 250)) return toast('Waist should be between 40 and 250 cm', 'warn'); l.bio.waist = r1(v); } else delete l.bio.waist;
  if (sl) { const v = num(sl, NaN); if (!(v >= 0 && v <= 16)) return toast('Sleep should be between 0 and 16 hours', 'warn'); l.bio.sleep = r2(v); } else delete l.bio.sleep;
  if (ui.bioEnergy) l.bio.energy = ui.bioEnergy; else delete l.bio.energy;
  if (!w) { const latest = latestWeightEntry(); if (latest) state.profile.currentWeight = latest.weight; }
  pruneLog(ui.date); refresh(); toast('Biometric check-in saved');
}
function saveExactActivity() {
  const st = Math.round(num($('trSteps').value)), wa = Math.round(num($('trWater').value));
  if (st < 0 || st > 100000) return toast('Steps should be between 0 and 100,000', 'warn');
  if (wa < 0 || wa > 10000) return toast('Water should be between 0 and 10,000 ml', 'warn');
  const l = ensureLog(ui.date); l.steps = st; l.water = wa; pruneLog(ui.date); refresh(); toast('Steps & water totals updated');
}

  const a = analyze(ui.date);
  const g = scoreGrade(a.score);
  const days = dateRange(ui.date, 7);
  const rows = days.map((d) => ({ d, s: daySummary(d), sc: analyze(d).score }));
  const logged = rows.filter((r) => r.s.hasAny);
  const avg = (fn) => logged.length ? sum(logged, fn) / logged.length : 0;
  const comp = [...(a.foodOn ? [['Calorie deficit', a.pts.calorie, 25, '#10B981'], ['Protein', a.pts.protein, 20, '#8B5CF6']] : []), ['Hydration', a.pts.water, 15, '#06B6D4'], ['Steps / NEAT', a.pts.steps, 15, '#F59E0B'], ['Cardio', a.pts.cardio, 10, '#F43F5E'], ['Weight trend', a.pts.weight, 10, '#7C3AED'], ['Recovery', a.pts.recovery, 5, '#6366F1']];
  const actions = a.audits.filter((x) => x.st === 'red' || x.st === 'amber').sort((x, y) => (x.st === 'red' ? 0 : 1) - (y.st === 'red' ? 0 : 1));

  $('view-insights').innerHTML = `
  <div class="fade-in space-y-5">

    </div>

    <div class="grid grid-cols-1 gap-4 lg:grid-cols-3">
      <div class="card card-pad flex flex-col items-center justify-center text-center">
        ${ring(a.score / 100, g.color, 170, 14, `<div class="text-5xl font-extrabold" style="color:${g.color}">${a.score}</div><div class="text-xs font-bold uppercase tracking-widest muted">of 100</div>`)}
        <div class="mt-3"><span class="pill ${g.cls} !text-xs">${g.label}</span></div>
        <div class="mt-2 text-sm muted">Daily Fitness Score</div>
      </div>
      <div class="card card-pad">
        <div class="h-title">Score Breakdown</div>${a.foodOn ? '' : '<div class="mt-1 text-[11px] muted">Food is not tracked, so calories and protein are skipped and these 55 points are scaled to 100.</div>'}
        <div class="mt-3 space-y-2.5">${comp.map(([n, v, max, c]) => `<div><div class="flex justify-between text-xs"><span class="font-semibold">${n}</span><span class="muted">${r1(v)} / ${max}</span></div>${bar(v / max, c, 'h-2 mt-1')}</div>`).join('')}</div>
      </div>
      <div class="card card-pad">
        <div class="h-title"><i class="fa-solid fa-list-ol mr-1 text-amber-500"></i>Priority Action Plan</div>
        <ol class="mt-3 space-y-2">${actions.length ? actions.slice(0, 5).map((x, i) => `<li class="flex gap-3"><span class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full text-xs font-bold text-white ${x.st === 'red' ? 'bg-rose-500' : 'bg-amber-500'}">${i + 1}</span><div><div class="text-sm font-bold">${esc(x.head)}</div><div class="text-[11px] muted">${esc(x.title)}</div></div></li>`).join('') : '<li class="rounded-xl bg-emerald-50 p-3 text-sm font-semibold text-emerald-700 dark:bg-emerald-400/10 dark:text-emerald-300"><i class="fa-solid fa-trophy"></i> No critical gaps. Keep the momentum!</li>'}</ol>
      </div>
    </div>

    <div class="grid grid-cols-1 gap-4 md:grid-cols-2" data-tour="audits">
      ${a.audits.map((x) => `
      <div class="card card-pad border-l-4 ${stBorder(x.st)}">
        <div class="flex items-start justify-between gap-3">
          <div class="flex items-center gap-3"><span class="flex h-10 w-10 items-center justify-center rounded-xl bg-amber-50 dark:bg-white/5"><i class="fa-solid ${x.icon} text-lg" style="color:${x.color}"></i></span>
          <div><div class="text-xs font-bold uppercase tracking-wide muted">${esc(x.title)}</div><div class="font-extrabold text-zinc-900 dark:text-white">${esc(x.head)}</div></div></div>
          ${stPill(x.st)}
        </div>
        <div class="mt-3 flex items-center justify-between text-xs"><span class="muted">Metric</span><span class="font-bold">${esc(x.metric)}</span></div>
        ${bar(x.pct, x.color, 'h-2 mt-1')}
        <p class="mt-3 text-sm leading-relaxed text-zinc-600 dark:text-zinc-300">${esc(x.det)}</p>

          <button class="btn btn-ghost btn-sm !px-2" title="Add 1 serving to log" onclick="addFood('${x.f.id}',ui.foodMeal||defaultMeal(),1)"><i class="fa-solid fa-plus"></i></button>

function swapMeal(mealId) {
  const ps = state.settings.planner;
  ps.swaps[ps.template] = ps.swaps[ps.template] || {};
  ps.swaps[ps.template][mealId] = (ps.swaps[ps.template][mealId] || 0) + 1;
  save({ skipSync: true }); renderPlanner();
}
function currentPlan() { const ps = state.settings.planner; return buildPlan(ps.template, planTargetKcal(), ps.swaps[ps.template] || {}); }
function applyMeal(mealId) {
  const m = currentPlan().meals.find((x) => x.meal.id === mealId); if (!m) return;
  m.items.forEach((i) => addFood(i.food.id, mealId, i.qty, ui.date, true));
  refresh(); toast(`${m.meal.name} (${fmt(m.kcal)} kcal) added to ${fmtDate(ui.date)}`);
}
async function applyPlan() {
  const plan = currentPlan();
  const existing = getLog(ui.date).foods.length;
  let replace = false;
  if (existing) {
    replace = await new Promise((resolve) => {
      openModal('Apply meal plan', `<p class="text-sm muted">${fmtLong(ui.date)} already has <b>${existing}</b> food item(s). Do you want to replace them with the <b>${esc(plan.tpl.name)}</b> plan (${fmt(plan.kcal)} kcal) or append the plan?</p>`,
        `<button class="btn btn-soft" onclick="closeModal()">Cancel</button><button class="btn btn-outline" id="apAppend">Append</button><button class="btn btn-primary" id="apReplace">Replace</button>`);
      window._modalResolve = () => resolve(null);
      $('apAppend').onclick = () => { window._modalResolve = null; closeModal(); resolve(false); };
      $('apReplace').onclick = () => { window._modalResolve = null; closeModal(); resolve(true); };
    });
    if (replace === null) return;
  }
  const l = ensureLog(ui.date);
  if (replace) l.foods = [];
  plan.meals.forEach((m) => m.items.forEach((i) => addFood(i.food.id, m.meal.id, i.qty, ui.date, true)));
  refresh(); toast(`${plan.tpl.name} applied • ${fmt(plan.kcal)} kcal, ${r1(plan.p)}g protein`);
}

function lockedField(label, value) {
  return `<div><label class="label">${label}</label><div class="input flex items-center justify-between !bg-amber-50 font-bold dark:!bg-amber-400/10"><span>${value}</span><span class="text-[10px] font-bold uppercase text-amber-600"><i class="fa-solid fa-lock"></i> Set by coach</span></div></div>`;
}
function trainerSelectHtml() {
  if (!isMember()) return `<select class="input" disabled><option>${cloud.available ? 'Sign in to choose a trainer' : 'Available on the cloud version'}</option></select>`;
  if (trainersCache === null) { loadTrainers().then(() => { if (ui.view === 'profile') renderProfile(); }); return '<select class="input" disabled><option>Loading trainers…</option></select>'; }

/* =====================================================================
 *  Module F: Data Vault & Cloud Account Sync
 * ===================================================================== */
const SESSION_KEY = 'miyeefit_pro_session';
const API_BASE = '';
const cloud = { available: null, status: 'idle', message: '', dirty: false, busy: false, queued: false, lastPullCheck: 0 };
let session = loadSession();

function loadSession() {
  try { const s = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); if (s && /^[0-9a-f]{64}$/.test(s.token) && s.user && s.user.id) return s; } catch (e) { /* ignore */ }
  return null;
}
function storeSession() { try { if (session) localStorage.setItem(SESSION_KEY, JSON.stringify(session)); else localStorage.removeItem(SESSION_KEY); } catch (e) { /* ignore */ } }
function persistLocal() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { toast('Local storage is full. Export a backup.', 'error'); } }
function exportableState() { const copy = JSON.parse(JSON.stringify(state)); delete copy.settings.cf; return copy; }
const firstName = (n) => String(n || 'there').trim().split(/\s+/)[0];

async function api(path, { method = 'GET', body, timeout = 20000 } = {}) {
  const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), timeout);
  try {
    const res = await fetch(API_BASE + path, {
      method, signal: ctrl.signal,
      headers: { 'Content-Type': 'application/json', ...(session ? { Authorization: 'Bearer ' + session.token } : {}) },
      body: body === undefined ? undefined : JSON.stringify(body)
    });
    let data = null; try { data = await res.json(); } catch (e) { data = null; }
    if (res.status === 401 && session && !/\/api\/auth\/(login|signup)$/.test(path)) handleExpired((data && data.error) || 'Your session has expired');
    if (!res.ok || !data) { const err = new Error((data && data.error) || `Request failed (HTTP ${res.status})`); err.status = res.status; err.data = data; throw err; }
    return data;
  } catch (e) {
    if (e.name === 'AbortError') { const err = new Error('The cloud took too long to respond. Please try again'); err.status = 0; throw err; }
    if (e.status === undefined) { const err = new Error('Cannot reach the cloud. Check your internet connection'); err.status = 0; throw err; }
    throw e;
  } finally { clearTimeout(timer); }
}

async function checkCloud() {
  if (location.protocol === 'file:') { cloud.available = false; return false; }
  try { const r = await api('/api/health', { timeout: 7000 }); cloud.available = !!r.ok; cloud.trainerCodeRequired = !!r.trainerCodeRequired; }
  catch (e) { cloud.available = !!(session && e.status === 0); if (cloud.available) setCloud('offline', 'Offline: changes are kept on this device'); }
  return cloud.available;
}

function setCloud(status, message) {
  cloud.status = status; cloud.message = message || '';
  renderSyncIndicator(); renderAccountBtn();
  if (ui.view === 'vault' && $('cloudCard')) $('cloudCard').innerHTML = cloudCardHtml();
}

function handleExpired(msg) {
  if (!session) return;
  session = null; storeSession(); cloud.dirty = false;
  setCloud('idle', '');
  toast(/sign in/i.test(msg) ? msg : msg + '. Please sign in again', 'warn');
  openAuth('login', { gate: false });
}

/* ---------- Sync engine ---------- */
let cloudTimer = null;
function scheduleCloudSync() {
  if (!session || session.user.role === 'trainer') return;
  cloud.dirty = true;
  clearTimeout(cloudTimer); cloudTimer = setTimeout(() => pushVault(), 1500);
  renderSyncIndicator();
}

async function pushVault({ force = false, silent = true } = {}) {
  if (!session || session.user.role === 'trainer') return false;
  if (cloud.busy) { cloud.queued = true; return false; }
  cloud.busy = true; setCloud('syncing', 'Saving to cloud…');
  try {
    const r = await api('/api/vault', { method: 'PUT', body: { baseRev: session.rev || 0, updatedAt: state.meta.updated, data: exportableState(), force: force || !!session.forceNext } });
    session.forceNext = false;
    session.rev = r.rev; session.syncedAt = r.savedAt; storeSession(); cloud.dirty = false;
    setCloud('ok', 'All changes saved to the cloud');
    if (!silent) toast('Saved to your cloud account ☁️');
    return true;
  } catch (e) {
    if (e.status === 409) { cloud.busy = false; return await resolveConflict(); }
    if (e.status !== 401) { setCloud(e.status === 0 ? 'offline' : 'error', e.status === 0 ? 'Offline: changes are kept on this device and will sync automatically' : e.message); if (!silent) toast(e.message, 'error'); }
    return false;
  } finally {
    cloud.busy = false;
    if (cloud.queued) { cloud.queued = false; if (cloud.dirty && session) scheduleCloudSync(); }
  }
}

async function resolveConflict() {
  // Another device saved since our last sync: merge both copies (newer side wins on overlapping fields), then save the result.
  try {
    const remote = await api('/api/vault');
    if (!remote.data) { session.rev = remote.rev; storeSession(); return await pushVault({ force: true }); }
    const remoteState = sanitizeState(remote.data);
    const remoteNewer = (remote.updatedAt || '') > state.meta.updated;
    const theme = state.settings.theme;
    const merged = remoteNewer ? mergeStates(remoteState, state) : mergeStates(state, remoteState);
    state = merged; state.settings.theme = theme; state.meta.owner = session.user.id; state.meta.updated = new Date().toISOString();
    persistLocal();
    session.rev = remote.rev; storeSession();
    renderAll();
    toast('Changes from your other device were merged', 'info');
    return await pushVault();
  } catch (e) { setCloud('error', e.message); return false; }
}

async function pullVault({ silent = true } = {}) {
  if (!session || session.user.role === 'trainer') return;
  if (session.forceNext) { await pushVault({ force: true }); return; }
  loadCoach({ quiet: silent });
  cloud.lastPullCheck = Date.now();
  try {
    if (!silent) setCloud('syncing', 'Checking for updates…');
    const r = await api('/api/vault');
    if (!r.data) { await pushVault({ force: true }); return; }
    if (r.rev !== session.rev) {
      if (cloud.dirty && state.meta.updated > (r.updatedAt || '')) { session.rev = r.rev; storeSession(); await pushVault(); }
      else adoptRemote(r, silent ? null : 'Latest data loaded from the cloud');
    } else if (cloud.dirty) { await pushVault({ silent }); }
    else { setCloud('ok', 'Up to date'); if (!silent) toast('Everything is already up to date', 'info'); }
  } catch (e) {
    if (e.status !== 401) setCloud(e.status === 0 ? 'offline' : 'error', e.message);
    if (!silent && e.status !== 401) toast(e.message, 'error');
  }
}

function adoptRemote(r, msg) {
  const theme = state.settings.theme;
  let incoming;
  try { incoming = sanitizeState(r.data); } catch (e) { setCloud('error', 'Cloud data could not be read: ' + e.message); return; }
  state = incoming; state.settings.theme = theme; state.meta.owner = session.user.id;
  session.rev = r.rev; session.syncedAt = r.savedAt || new Date().toISOString(); storeSession(); cloud.dirty = false;
  persistLocal(); applyTheme();
  setCloud('ok', 'Synced with the cloud');
  renderAll();
  if (msg) toast(msg, 'info');
}

function mergeStates(cloudState, deviceState) {
  const out = JSON.parse(JSON.stringify(cloudState));
  Object.entries(deviceState.logs).forEach(([d, l]) => {
    const c = out.logs[d];
    if (!c) { out.logs[d] = JSON.parse(JSON.stringify(l)); return; }
    const ids = new Set(c.foods.map((f) => f.id)); l.foods.forEach((f) => { if (!ids.has(f.id)) c.foods.push(f); });
    const cids = new Set(c.cardio.map((x) => x.id)); l.cardio.forEach((x) => { if (!cids.has(x.id)) c.cardio.push(x); });
    c.steps = Math.max(c.steps, l.steps); c.water = Math.max(c.water, l.water);
    c.bio = { ...l.bio, ...c.bio };
    c.done = [...new Set([...(c.done || []), ...(l.done || [])])];
    const bids = new Set((c.bp || []).map((x) => x.id)); c.bp = [...(c.bp || []), ...(l.bp || []).filter((x) => !bids.has(x.id))].sort((x, y) => x.time.localeCompare(y.time));
  });
  const fids = new Set(out.customFoods.map((f) => f.id));
  deviceState.customFoods.forEach((f) => { if (!fids.has(f.id)) out.customFoods.push(f); });
  return out;
}

  if (sameOwner) { state.meta.owner = user.id; session.rev = remote.rev; storeSession(); cloud.dirty = true; await pushVault(); renderAll(); toast(`Welcome back, ${firstName(user.name)}! Offline changes were synced`); return; }

async function submitAuth(e) {
  e.preventDefault();
  const signup = authUi.mode === 'signup';
  const err = (m) => { const el = $('auError'); el.textContent = m; el.classList.remove('hidden'); };
  $('auError').classList.add('hidden');
  const email = $('auEmail').value.trim(), password = $('auPass').value;
  const name = signup ? $('auName').value.trim() : '';
  if (signup && !name) return err('Please enter your name.');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return err('Please enter a valid email address.');
  if (signup && password.length < 8) return err('Password must be at least 8 characters.');
  if (!password) return err('Please enter your password.');
  if (signup && password !== $('auPass2').value) return err('Passwords do not match.');
  const btn = $('auSubmit'); const label = btn.innerHTML;
  btn.disabled = true; btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i>${signup ? 'Creating account…' : 'Signing in…'}`;
  try {
    const extra = signup && authUi.role === 'trainer' ? { role: 'trainer', specialization: $('auSpec').value, experience: $('auExp').value, trainerCode: $('auCode') ? $('auCode').value : '' } : { role: 'member' };
    const r = await api(signup ? '/api/auth/signup' : '/api/auth/login', { method: 'POST', body: signup ? { name, email, password, ...extra } : { email, password } });
    await afterSignIn(r.user, r.token, signup);
  } catch (ex) {
    if ($('auSubmit')) { btn.disabled = false; btn.innerHTML = label; err(ex.message); }
  }
}

    const line = st === 'syncing' ? 'Saving…' : st === 'offline' ? 'Offline, saved on device' : st === 'error' ? 'Sync issue: open Data Vault' : session.syncedAt ? `Saved ${timeAgo(session.syncedAt)}` : 'Connected';
    txt.innerHTML = `<div class="truncate font-semibold text-zinc-700 dark:text-zinc-200">${esc(session.user.email)}</div><div>${line}</div>`;

  }

function timeAgo(iso) {
  const s = Math.round((Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return 'just now'; if (s < 3600) return Math.round(s / 60) + ' min ago'; if (s < 86400) return Math.round(s / 3600) + ' h ago'; return Math.round(s / 86400) + ' d ago';
}

function signOutDialog() {
  openModal('<i class="fa-solid fa-right-from-bracket text-amber-500"></i> Sign out', `

  $('soGo').onclick = async () => {

async function signOut(clear) {
  if (session) { try { await api('/api/auth/logout', { method: 'POST', timeout: 6000 }); } catch (e) { /* session will expire on its own */ } }
  session = null; storeSession(); cloud.dirty = false; clearTimeout(cloudTimer);
  resetCoach(); trainerUi.clients = null; trainerUi.detail = null; trainerUi.profile = null; ui.view = 'dashboard';
  if (clear) { const theme = state.settings.theme; state = defaultState(); state.settings.theme = theme; ui.date = todayStr(); persistLocal(); }
  setCloud('idle', '');
  renderAll();
  toast('Signed out', 'info');
  if (cloud.available) openAuth('login', { gate: true });
}

    } catch (e) { if ($('daGo')) $('daGo').disabled = false; toast(e.message, 'error'); }
  };
}

/* ---------- Data Vault view ---------- */
function vaultStats() {
  const raw = JSON.stringify(state);
  const days = Object.keys(state.logs).sort();
  const foods = sum(days, (d) => state.logs[d].foods.length);
  const cardio = sum(days, (d) => state.logs[d].cardio.length);
  const weighIns = days.filter((d) => state.logs[d].bio.weight).length;
  return { kb: new Blob([raw]).size / 1024, days: days.length, foods, cardio, weighIns, custom: state.customFoods.length, records: days.length + foods + cardio + weighIns + state.customFoods.length, first: days[0], last: days[days.length - 1] };
}

/* ---------- File backup & portability ---------- */
function downloadFile(name, content, type) {
  const blob = new Blob([content], { type }); const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}
function exportJSON() {
  const payload = { app: 'MiyeeFit Pro', brand: 'Miyee Tech Labs', website: 'https://miyeetechlabs.com', schema: SCHEMA, exportedAt: new Date().toISOString(), data: exportableState() };
  downloadFile(`miyeefit-pro-backup-${todayStr()}.json`, JSON.stringify(payload, null, 2), 'application/json');
  toast('Full backup exported');
}
function importJSON(input) {
  const file = input.files && input.files[0]; input.value = '';
  if (!file) return;
  if (file.size > 15 * 1024 * 1024) return toast('Backup file is too large (max 15 MB)', 'error');
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const parsed = JSON.parse(reader.result);
      const raw = parsed && parsed.data && parsed.data.profile ? parsed.data : parsed;
      if (parsed.schema && parsed.schema !== SCHEMA) throw new Error(`Unsupported schema "${parsed.schema}"`);
      const incoming = sanitizeState(raw);
      const days = Object.keys(incoming.logs).length;
      const ok = await confirmDialog({ title: 'Restore backup', message: `<b>${esc(file.name)}</b> is a valid MiyeeFit Pro backup for <b>${esc(incoming.profile.name)}</b> with <b>${days}</b> logged day(s) and <b>${incoming.customFoods.length}</b> custom food(s).<br><br>This will replace all current data on this device${session ? ' <b>and in your cloud account</b>' : ''}.`, confirmText: 'Restore backup' });
      if (!ok) return;
      state = incoming;
      if (session) state.meta.owner = session.user.id;
      applyTheme(); save(); renderAll(); toast(`Backup restored • ${days} day(s)`);
    } catch (e) { toast('Import failed: ' + e.message, 'error'); }
  };
  reader.onerror = () => toast('Could not read the file', 'error');
  reader.readAsText(file);
}

    const tpl = tplIds[i % tplIds.length];

    }

    waist = waist - R(0, 0.18);

    { // home blood pressure: slowly improving with activity, morning slightly higher than evening

/* =====================================================================
 *  Module H: Blood Pressure & Pulse Tracker
 *  Classification: ISH 2020 (International Society of Hypertension, aligned with
 *  Indian and ESC/ESH guidelines) and ACC/AHA 2017. Home-monitoring threshold
 *  135/85 mmHg (ISH 2020, ESH). Resting pulse 60 to 100 bpm (AHA).
 * ===================================================================== */
const BP_SLOTS = { morning: 'Morning', evening: 'Evening' };
const BP_TONE = { green: { pill: 'pill-green', color: '#10B981' }, amber: { pill: 'pill-amber', color: '#F59E0B' }, red: { pill: 'pill-red', color: '#F43F5E' }, gray: { pill: 'pill-gray', color: '#A1A1AA' } };
const avgOf = (xs) => (xs.length ? sum(xs) / xs.length : null);
const fmtBp = (s, d) => (s == null ? '-' : `${Math.round(s)}/${Math.round(d)}`);

function bpIsh(sys, dia) {
  if (sys >= 180 || dia >= 110) return { key: 'severe', label: 'Severe hypertension', tone: 'red' };
  if (sys >= 160 || dia >= 100) return { key: 'grade2', label: 'Grade 2 hypertension', tone: 'red' };
  if (sys >= 140 || dia >= 90) return { key: 'grade1', label: 'Grade 1 hypertension', tone: 'red' };
  if (sys >= 130 || dia >= 85) return { key: 'highnormal', label: 'High-normal', tone: 'amber' };
  if (sys < 90 || dia < 60) return { key: 'low', label: 'Low (hypotension)', tone: 'amber' };
  return { key: 'normal', label: 'Normal', tone: 'green' };
}
function bpAha(sys, dia) {
  if (sys > 180 || dia > 120) return { label: 'Hypertensive crisis', tone: 'red' };
  if (sys >= 140 || dia >= 90) return { label: 'Stage 2 hypertension', tone: 'red' };
  if (sys >= 130 || dia >= 80) return { label: 'Stage 1 hypertension', tone: 'amber' };
  if (sys >= 120) return { label: 'Elevated', tone: 'amber' };
  if (sys < 90 || dia < 60) return { label: 'Low', tone: 'amber' };
  return { label: 'Normal', tone: 'green' };
}
function bpHome(sys, dia) {
  if (sys >= 135 || dia >= 85) return { label: 'Above the home threshold (135/85)', short: 'High', tone: 'red' };
  if (sys >= 130 || dia >= 80) return { label: 'Upper-normal for home readings', short: 'Upper-normal', tone: 'amber' };
  if (sys < 90 || dia < 60) return { label: 'Low for home readings', short: 'Low', tone: 'amber' };
  return { label: 'Normal for home readings', short: 'Normal', tone: 'green' };
}
function pulseClass(p) {
  if (p == null) return { label: '-', tone: 'gray' };
  if (p > 100) return { label: 'High (above 100)', tone: 'red' };
  if (p < 50) return { label: 'Low (below 50)', tone: 'amber' };
  if (p < 60) return { label: 'Below 60 (normal if you are fit)', tone: 'green' };
  return { label: 'Normal (60 to 100)', tone: 'green' };
}
const tonePill = (tone, text) => `<span class="pill ${BP_TONE[tone].pill}">${esc(text)}</span>`;

function bpDay(date) {
  const r = (getLog(date).bp || []);
  const pick = (slot) => r.filter((x) => x.slot === slot);
  const stat = (xs) => ({ sys: avgOf(xs.map((x) => x.sys)), dia: avgOf(xs.map((x) => x.dia)), pulse: avgOf(xs.filter((x) => x.pulse).map((x) => x.pulse)), n: xs.length });
  return { date, readings: r, morning: stat(pick('morning')), evening: stat(pick('evening')), all: stat(r) };
}

function bpAnalysis(end = ui.date) {
  const days7 = dateRange(end, 7).map(bpDay).filter((d) => d.all.n);
  let readings7 = days7.flatMap((d) => d.readings);
  // ESH/ISH protocol: with 4 or more days, the first day's readings are discarded.
  if (days7.length >= 4) readings7 = days7.slice(1).flatMap((d) => d.readings);
  const av = (xs, k) => avgOf(xs.filter((x) => x[k]).map((x) => x[k]));
  const sys7 = av(readings7, 'sys'), dia7 = av(readings7, 'dia'), pulse7 = av(readings7, 'pulse');
  const mornings = readings7.filter((x) => x.slot === 'morning'), evenings = readings7.filter((x) => x.slot === 'evening');
  const days30 = dateRange(end, 30).map(bpDay).filter((d) => d.all.n);
  const start30 = addDays(end, -29);
  const sysPts = days30.map((d) => ({ x: daysBetween(start30, d.date), y: d.all.sys }));
  const diaPts = days30.map((d) => ({ x: daysBetween(start30, d.date), y: d.all.dia }));
  const span = sysPts.length >= 2 ? sysPts[sysPts.length - 1].x - sysPts[0].x : 0;
  const r14 = dateRange(end, 14).map(bpDay).flatMap((d) => d.readings);
  const sd = (xs) => { if (xs.length < 3) return null; const m = avgOf(xs); return Math.sqrt(sum(xs, (x) => (x - m) ** 2) / (xs.length - 1)); };
  const active = [], rest = [];
  days30.forEach((d) => { (daySummary(d.date).cardioMin >= 30 ? active : rest).push(d.all.sys); });
  return {
    n7: readings7.length, days7: days7.length, reliable: days7.length >= 3 && readings7.length >= 6,
    sys7, dia7, pulse7, home: sys7 != null ? bpHome(sys7, dia7) : null, ish7: sys7 != null ? bpIsh(sys7, dia7) : null,
    mSys: av(mornings, 'sys'), mDia: av(mornings, 'dia'), eSys: av(evenings, 'sys'), eDia: av(evenings, 'dia'), nM: mornings.length, nE: evenings.length,
    trendSys: span >= 7 && sysPts.length >= 5 ? linSlope(sysPts) * 7 : null, trendDia: span >= 7 && diaPts.length >= 5 ? linSlope(diaPts) * 7 : null, trendDays: days30.length,
    sdSys: sd(r14.map((x) => x.sys)),
    pp: sys7 != null ? sys7 - dia7 : null, map: sys7 != null ? dia7 + (sys7 - dia7) / 3 : null,
    activeSys: active.length >= 3 && rest.length >= 3 ? avgOf(active) : null, restSys: active.length >= 3 && rest.length >= 3 ? avgOf(rest) : null, nActive: active.length, nRest: rest.length,
    last: (() => { for (let i = 0; i < 30; i++) { const d = bpDay(addDays(end, -i)); if (d.readings.length) return { date: d.date, r: d.readings[d.readings.length - 1] }; } return null; })()
  };
}

function bpTips(a) {
  const tips = [];
  const key = a.ish7 ? a.ish7.key : null;
  if (key === 'severe' || key === 'grade2' || key === 'grade1' || (a.home && a.home.tone === 'red')) tips.push('Share these readings with your doctor soon. Home averages at or above 135/85 meet the international definition of high blood pressure and should be confirmed by a doctor.');
  if (key === 'low') tips.push('If low readings come with dizziness, fainting or weakness, sit or lie down, drink water and talk to your doctor.');
  tips.push('Keep salt under 5 g a day (about one teaspoon), as recommended by WHO. Go easy on pickles, papad, namkeen, and packaged or restaurant food.');
  tips.push('Eat more potassium-rich vegetarian foods: vegetables, fruit such as banana and papaya, dals, and low-fat curd. This DASH-style pattern lowers blood pressure.');
  tips.push('Aim for at least 150 minutes of moderate activity a week, such as brisk walking. Regular exercise typically lowers systolic pressure by 4 to 8 mmHg.');
  if (state.profile.currentWeight && bmiInfo().bmi >= 23) tips.push('Losing weight helps: roughly 1 mmHg lower systolic pressure for every kg lost.');
  tips.push('Sleep 7 to 9 hours, limit alcohol and caffeine, and do not smoke.');
  tips.push('Take any prescribed blood pressure medicine exactly as advised. Never stop or change it based on this app.');
  return tips;
}

/* ---------- Logging ---------- */
function defaultBpSlot() { return ui.date === todayStr() && new Date().getHours() >= 14 ? 'evening' : (ui.bpSlot || 'morning'); }
function addBpReading() {
  const sys = Math.round(num($('bpSys').value, NaN)), dia = Math.round(num($('bpDia').value, NaN));
  const pulseRaw = $('bpPulse').value.trim(), pulse = pulseRaw ? Math.round(num(pulseRaw, NaN)) : null;
  if (!(sys >= 60 && sys <= 260)) return toast('Systolic (top number) should be between 60 and 260 mmHg', 'warn');
  if (!(dia >= 30 && dia <= 160)) return toast('Diastolic (bottom number) should be between 30 and 160 mmHg', 'warn');
  if (sys <= dia) return toast('Systolic (top number) must be higher than diastolic (bottom number)', 'warn');
  if (pulse !== null && !(pulse >= 30 && pulse <= 220)) return toast('Pulse should be between 30 and 220 bpm', 'warn');
  const slot = ui.bpSlot || defaultBpSlot();
  const time = /^\d{2}:\d{2}$/.test($('bpTime').value) ? $('bpTime').value : (slot === 'morning' ? '07:30' : '20:00');
  const l = ensureLog(ui.date);
  l.bp.push({ id: uid(), slot, time, sys, dia, pulse, notes: $('bpNotes').value.trim().slice(0, 120) });
  l.bp.sort((a, b) => a.time.localeCompare(b.time));
  refresh();
  const c = bpIsh(sys, dia);
  if (c.key === 'severe') {
    openModal('<i class="fa-solid fa-triangle-exclamation text-rose-500"></i> Very high reading', `
      <p class="text-sm"><b>${sys}/${dia} mmHg</b> is in the severe range (180/110 or higher).</p>
      <ol class="mt-3 list-decimal space-y-1 pl-5 text-sm">
        <li>Sit quietly for 5 minutes and measure again.</li>
        <li>If it is still this high, contact your doctor today.</li>
        <li><b>Get emergency help now</b> if you also have chest pain, shortness of breath, a severe headache, weakness or numbness, difficulty speaking, or blurred vision.</li>
      </ol>`);
  } else toast(`${BP_SLOTS[slot]} reading saved: ${sys}/${dia}${pulse ? `, pulse ${pulse}` : ''} (${c.label})`, c.tone === 'green' ? 'success' : 'warn');
}
function removeBpReading(id) { const l = ensureLog(ui.date); l.bp = l.bp.filter((x) => x.id !== id); pruneLog(ui.date); refresh(); toast('Reading removed', 'info'); }

function bpAudit(date) {
