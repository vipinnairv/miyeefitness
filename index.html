  if (!a.n7) return { key: 'bp', noScore: true, title: 'Blood Pressure (not scored)', icon: 'fa-stethoscope', color: '#F43F5E', st: 'gray', head: 'No BP readings this week', det: 'Optional: log your blood pressure and pulse each morning and evening in the BP tracker to see your 7-day home average.', metric: '0 readings', pct: 0 };
  const st = a.home.tone === 'green' ? 'green' : a.home.tone === 'amber' ? 'amber' : 'red';
  return { key: 'bp', noScore: true, title: 'Blood Pressure (not scored)', icon: 'fa-stethoscope', color: '#F43F5E', st,
    head: `Home average ${fmtBp(a.sys7, a.dia7)} mmHg`,
    det: `${a.home.label}. Based on ${a.n7} reading(s) over ${a.days7} day(s)${a.reliable ? '' : '; measure morning and evening for at least 3 days for a reliable average'}. ${st === 'red' ? 'Share these readings with your doctor.' : st === 'amber' ? 'Cut salt, keep walking daily and keep monitoring.' : 'Keep it up.'}`,
    metric: `${fmtBp(a.sys7, a.dia7)}${a.pulse7 ? ` • ${Math.round(a.pulse7)} bpm` : ''}`, pct: clamp(1 - Math.max(0, a.sys7 - 120) / 40, 0, 1) };
}

/* ---------- BP view ---------- */
function renderBp() {
  const a = bpAnalysis(), today = bpDay(ui.date);
  if (!ui.bpSlot || ui.bpSlotDate !== ui.date) { ui.bpSlot = defaultBpSlot(); ui.bpSlotDate = ui.date; }
  const nowT = ui.date === todayStr() ? `${pad2(new Date().getHours())}:${pad2(new Date().getMinutes())}` : (ui.bpSlot === 'morning' ? '07:30' : '20:00');
  const reading = (x) => { const c = bpIsh(x.sys, x.dia), h = bpAha(x.sys, x.dia), pc = pulseClass(x.pulse); return `
    <div class="flex items-center gap-3 rounded-xl border border-amber-100 p-3 dark:border-white/5">
      <div class="w-12 text-center"><div class="text-xs font-bold muted">${esc(x.time)}</div><i class="fa-solid ${x.slot === 'morning' ? 'fa-sun text-amber-500' : 'fa-moon text-indigo-400'}"></i></div>
      <div class="min-w-0 flex-1"><div class="text-lg font-extrabold">${x.sys}/${x.dia} <span class="text-xs font-semibold muted">mmHg</span>${x.pulse ? ` <span class="ml-2 text-sm font-bold text-rose-500"><i class="fa-solid fa-heart"></i> ${x.pulse}</span> <span class="text-xs muted">bpm</span>` : ''}</div>
        <div class="mt-1 flex flex-wrap gap-1">${tonePill(c.tone, 'ISH: ' + c.label)}${tonePill(h.tone, 'AHA: ' + h.label)}${x.pulse ? tonePill(pc.tone, 'Pulse: ' + pc.label) : ''}</div>${x.notes ? `<div class="mt-1 text-xs muted">${esc(x.notes)}</div>` : ''}</div>
      <button class="btn btn-ghost btn-sm !px-1.5 text-rose-500" onclick="removeBpReading('${x.id}')" aria-label="Remove reading"><i class="fa-solid fa-trash-can"></i></button></div>`; };
  const slotBlock = (slot) => { const d = today[slot]; const rs = today.readings.filter((x) => x.slot === slot); return `
    <div><div class="mb-2 flex items-center justify-between"><div class="flex items-center gap-2 text-sm font-bold"><i class="fa-solid ${slot === 'morning' ? 'fa-sun text-amber-500' : 'fa-moon text-indigo-400'}"></i>${BP_SLOTS[slot]}</div>${d.n ? `<div class="text-xs muted">Average <b class="text-zinc-800 dark:text-zinc-100">${fmtBp(d.sys, d.dia)}</b>${d.pulse ? ` • ${Math.round(d.pulse)} bpm` : ''}</div>` : ''}</div>
    <div class="space-y-2">${rs.length ? rs.map(reading).join('') : `<div class="rounded-xl border border-dashed border-amber-200 p-3 text-center text-xs muted dark:border-white/10">No ${slot} reading</div>`}</div></div>`; };
  const stat = (label, value, sub, tone) => `<div class="card p-4"><div class="text-[11px] font-bold uppercase muted">${label}</div><div class="mt-1 text-xl font-extrabold">${value}</div><div class="mt-1 text-xs muted">${sub}</div>${tone ? `<div class="mt-2">${tone}</div>` : ''}</div>`;
  const trendTxt = (v) => (v == null ? '-' : `${v > 0 ? '+' : ''}${r1(v)} mmHg/week`);
  const diff = a.nM >= 2 && a.nE >= 2 ? a.mSys - a.eSys : null;
  const hist = dateRange(ui.date, 14).map(bpDay).filter((d) => d.all.n).reverse();
  const curKey = a.ish7 ? a.ish7.key : null;
  $('view-bp').innerHTML = `
  <div class="fade-in space-y-5">
    <div class="flex flex-wrap items-end justify-between gap-3">
      <div><h1 class="text-2xl font-extrabold tracking-tight text-zinc-900 dark:text-white sm:text-3xl">Blood <span class="text-grad">Pressure</span></h1>
      <p class="text-sm muted">Morning and evening readings with pulse • classified by ISH 2020 and ACC/AHA 2017 • ${fmtLong(ui.date)}</p></div>
    </div>

    <div class="grid grid-cols-1 gap-5 xl:grid-cols-3">
      <div class="card card-pad" data-tour="bp-log">
        <div class="h-title"><i class="fa-solid fa-plus mr-1 text-rose-500"></i>Log a reading</div>
        <div class="mt-3 grid grid-cols-2 gap-1.5">${Object.entries(BP_SLOTS).map(([k, v]) => `<button class="chip !rounded-lg !py-2 ${ui.bpSlot === k ? 'active' : ''}" onclick="ui.bpSlot='${k}';renderBp()"><i class="fa-solid ${k === 'morning' ? 'fa-sun' : 'fa-moon'}"></i> ${v}</button>`).join('')}</div>
        <div class="mt-3 grid grid-cols-2 gap-2">
          <div><label class="label" for="bpSys">Systolic (top)</label><input id="bpSys" type="number" inputmode="numeric" min="60" max="260" class="input" placeholder="e.g. 128"></div>
          <div><label class="label" for="bpDia">Diastolic (bottom)</label><input id="bpDia" type="number" inputmode="numeric" min="30" max="160" class="input" placeholder="e.g. 82"></div>
          <div><label class="label" for="bpPulse">Pulse (bpm)</label><input id="bpPulse" type="number" inputmode="numeric" min="30" max="220" class="input" placeholder="e.g. 72"></div>
          <div><label class="label" for="bpTime">Time</label><input id="bpTime" type="time" class="input" value="${nowT}"></div>
          <div class="col-span-2"><label class="label" for="bpNotes">Notes (optional)</label><input id="bpNotes" class="input" maxlength="120" placeholder="e.g. left arm, before medicine"></div>
        </div>
        <button class="btn btn-primary mt-3 w-full" onclick="addBpReading()"><i class="fa-solid fa-floppy-disk"></i>Save ${BP_SLOTS[ui.bpSlot].toLowerCase()} reading</button>
        <details class="mt-4 text-sm"><summary class="cursor-pointer font-semibold text-amber-700 dark:text-amber-400">How to measure correctly</summary>
          <ul class="mt-2 list-disc space-y-1 pl-5 text-xs muted">
            <li>No caffeine, smoking or exercise for 30 minutes before. Empty your bladder.</li>
            <li>Sit with your back supported and feet flat for 5 minutes. Do not talk.</li>
            <li>Rest your arm on a table with the cuff at heart level, on bare skin.</li>
            <li>Take 2 readings 1 minute apart and log both.</li>
            <li>Morning: within an hour of waking, before breakfast and medicine. Evening: before dinner.</li>
            <li>Measure for at least 3 to 7 days in a row for a reliable home average (ISH 2020).</li>
          </ul></details>
      </div>
      <div class="card card-pad xl:col-span-2">
        <div class="flex items-center justify-between"><div class="h-title">${ui.date === todayStr() ? "Today's readings" : 'Readings for ' + fmtDate(ui.date, { weekday: 'short', day: 'numeric', month: 'short' })}</div><span class="text-xs muted">${today.readings.length} reading(s)</span></div>
        <div class="mt-3 grid grid-cols-1 gap-4 md:grid-cols-2">${slotBlock('morning')}${slotBlock('evening')}</div>
      </div>
    </div>

    <div class="grid grid-cols-1 gap-3 sm:grid-cols-2 xl:grid-cols-4" data-tour="bp-analysis">
      ${stat('7-day home average', a.sys7 != null ? `${fmtBp(a.sys7, a.dia7)} <span class="text-xs muted">mmHg</span>` : '-', a.n7 ? `${a.n7} reading(s), ${a.days7} day(s)${a.reliable ? '' : '. Measure 3+ days, morning and evening'}` : 'No readings in the last 7 days', a.home ? tonePill(a.home.tone, a.home.label) : '')}
      ${stat('Average pulse', a.pulse7 ? `${Math.round(a.pulse7)} <span class="text-xs muted">bpm</span>` : '-', 'Normal resting range 60 to 100 bpm', a.pulse7 ? tonePill(pulseClass(a.pulse7).tone, pulseClass(a.pulse7).label) : '')}
      ${stat('Morning vs evening', diff != null ? `${diff > 0 ? '+' : ''}${Math.round(diff)} <span class="text-xs muted">mmHg</span>` : '-', diff != null ? `Morning ${fmtBp(a.mSys, a.mDia)} • evening ${fmtBp(a.eSys, a.eDia)}` : 'Needs 2+ morning and 2+ evening readings', diff != null ? tonePill(diff >= 15 ? 'amber' : 'green', diff >= 15 ? 'Morning is notably higher' : 'Balanced') : '')}
      ${stat('30-day trend', trendTxt(a.trendSys), a.trendSys != null ? `Diastolic ${trendTxt(a.trendDia)} • ${a.trendDays} day(s) with readings` : 'Needs 5+ days of readings over at least a week', a.trendSys != null ? tonePill(a.trendSys <= -0.5 ? 'green' : a.trendSys >= 1 ? 'red' : 'gray', a.trendSys <= -0.5 ? 'Improving' : a.trendSys >= 1 ? 'Rising' : 'Stable') : '')}
      ${stat('Day-to-day variability', a.sdSys != null ? `±${r1(a.sdSys)} <span class="text-xs muted">mmHg</span>` : '-', 'Spread of systolic readings over 14 days. Lower is steadier.', a.sdSys != null ? tonePill(a.sdSys > 15 ? 'amber' : 'green', a.sdSys > 15 ? 'High variability' : 'Steady') : '')}
      ${stat('Pulse pressure', a.pp != null ? `${Math.round(a.pp)} <span class="text-xs muted">mmHg</span>` : '-', 'Systolic minus diastolic. Typical adult range is about 40 to 60.', a.pp != null ? tonePill(a.pp > 60 ? 'amber' : a.pp < 25 ? 'amber' : 'green', a.pp > 60 ? 'Wide' : a.pp < 25 ? 'Narrow' : 'Typical') : '')}
      ${stat('Mean arterial pressure', a.map != null ? `${Math.round(a.map)} <span class="text-xs muted">mmHg</span>` : '-', 'Average pressure in your arteries during one heartbeat (70 to 100 is typical).', '')}
      ${stat('Exercise days vs rest days', a.activeSys != null ? `${Math.round(a.activeSys)} vs ${Math.round(a.restSys)}` : '-', a.activeSys != null ? `Average systolic on days with 30+ min exercise (${a.nActive}) vs other days (${a.nRest})` : 'Needs 3+ exercise days and 3+ rest days with readings', a.activeSys != null ? tonePill(a.activeSys < a.restSys ? 'green' : 'gray', a.activeSys < a.restSys ? `${Math.round(a.restSys - a.activeSys)} mmHg lower when active` : 'No clear difference yet') : '')}
    </div>

    <div class="grid grid-cols-1 gap-4 xl:grid-cols-3">
      <div class="card card-pad xl:col-span-2">
        <div class="mb-3 flex flex-wrap items-center justify-between gap-2"><div><div class="h-title">Blood pressure trend</div><div class="text-xs muted">Daily morning and evening averages • dashed lines = home threshold 135/85</div></div>
          <div class="flex gap-1">${[14, 30].map((r) => `<button class="chip ${(ui.bpRange || 14) === r ? 'active' : ''}" onclick="ui.bpRange=${r};renderBp()">${r}D</button>`).join('')}</div></div>
        <div class="h-64"><canvas id="chBp"></canvas></div>
      </div>
      <div class="card card-pad"><div class="h-title">Pulse trend</div><div class="text-xs muted">Daily average, bpm</div><div class="mt-3 h-56"><canvas id="chPulse"></canvas></div></div>
    </div>

    <div class="grid grid-cols-1 gap-4 xl:grid-cols-2">
      <div class="card card-pad">
        <div class="h-title"><i class="fa-solid fa-lightbulb mr-1 text-amber-500"></i>What to do</div>
        <ul class="mt-3 space-y-2 text-sm">${bpTips(a).map((t) => `<li class="flex gap-2"><i class="fa-solid fa-check mt-1 text-emerald-500"></i><span>${esc(t)}</span></li>`).join('')}</ul>
        <p class="mt-3 text-[11px] muted">This tracker supports, but does not replace, medical advice. Diagnosis needs confirmation by a doctor.</p>
      </div>
      <div class="card card-pad">
        <div class="h-title">Classification guide</div>
        <div class="scroll-thin mt-3 overflow-x-auto"><table class="tbl w-full">
          <thead><tr><th>ISH 2020 category</th><th>Systolic</th><th></th><th>Diastolic</th></tr></thead>
          <tbody>${[['normal', 'Normal', '< 130', 'and', '< 85'], ['highnormal', 'High-normal', '130 to 139', 'and/or', '85 to 89'], ['grade1', 'Grade 1 hypertension', '140 to 159', 'and/or', '90 to 99'], ['grade2', 'Grade 2 hypertension', '≥ 160', 'and/or', '≥ 100'], ['severe', 'Severe (seek care)', '≥ 180', 'and/or', '≥ 110'], ['low', 'Low (hypotension)', '< 90', 'or', '< 60']].map(([k, l, s, j, d]) => `<tr class="${curKey === k ? 'bg-amber-50 font-bold dark:bg-amber-400/10' : ''}"><td>${l}${curKey === k ? ' ◀ you' : ''}</td><td>${s}</td><td class="muted">${j}</td><td>${d}</td></tr>`).join('')}</tbody></table></div>
        <p class="mt-2 text-[11px] muted">Home readings: an average of 135/85 or higher means high blood pressure (ISH 2020, ESH). ACC/AHA 2017 uses lower cut-offs: elevated 120 to 129, stage 1 from 130/80, stage 2 from 140/90.</p>
      </div>
    </div>

    <div class="card card-pad">
      <div class="h-title">Last 14 days</div>
      <div class="scroll-thin mt-3 overflow-x-auto"><table class="tbl w-full">
        <thead><tr><th>Date</th><th>Morning</th><th>Evening</th><th>Day average</th><th>Pulse</th><th>ISH category</th></tr></thead>
        <tbody>${hist.length ? hist.map((d) => { const c = bpIsh(d.all.sys, d.all.dia); return `<tr class="cursor-pointer hover:bg-amber-50/60 dark:hover:bg-white/[.03]" onclick="setDate('${d.date}')"><td class="font-semibold">${fmtDate(d.date, { weekday: 'short', day: 'numeric', month: 'short' })}</td><td>${d.morning.n ? fmtBp(d.morning.sys, d.morning.dia) : '-'}</td><td>${d.evening.n ? fmtBp(d.evening.sys, d.evening.dia) : '-'}</td><td class="font-bold">${fmtBp(d.all.sys, d.all.dia)}</td><td>${d.all.pulse ? Math.round(d.all.pulse) : '-'}</td><td>${tonePill(c.tone, c.label)}</td></tr>`; }).join('') : '<tr><td colspan="6" class="text-center muted">No readings yet</td></tr>'}</tbody></table></div>
    </div>
  </div>`;
  drawBpCharts();
}

function drawBpCharts() {
  const days = dateRange(ui.date, ui.bpRange || 14), cc = chartColors();
  const ds = days.map(bpDay);
  const val = (d, slot, k) => (d[slot].n && d[slot][k] != null ? Math.round(d[slot][k]) : null);
  const line = (label, data, color, dash) => ({ label, data, borderColor: color, backgroundColor: color, borderDash: dash || [], pointRadius: dash ? 0 : 3, borderWidth: dash ? 1.5 : 2.2, spanGaps: true, tension: 0.3, fill: false });
  mkChart('chBp', { type: 'line', data: { labels: days.map((d) => fmtDate(d)), datasets: [
    line('Morning systolic', ds.map((d) => val(d, 'morning', 'sys')), '#F43F5E'), line('Evening systolic', ds.map((d) => val(d, 'evening', 'sys')), '#FB923C'),
    line('Morning diastolic', ds.map((d) => val(d, 'morning', 'dia')), '#8B5CF6'), line('Evening diastolic', ds.map((d) => val(d, 'evening', 'dia')), '#06B6D4'),
    line('135 systolic threshold', days.map(() => 135), 'rgba(244,63,94,.55)', [6, 5]), line('85 diastolic threshold', days.map(() => 85), 'rgba(139,92,246,.55)', [6, 5])] },
    options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, usePointStyle: true, color: cc.text, filter: (it) => !/threshold/.test(it.text) } } }, scales: { ...baseScales('mmHg'), y: { ...baseScales('mmHg').y, suggestedMin: 60, suggestedMax: 160 } } } });
  mkChart('chPulse', { type: 'line', data: { labels: days.map((d) => fmtDate(d)), datasets: [line('Pulse', ds.map((d) => (d.all.pulse ? Math.round(d.all.pulse) : null)), '#F43F5E'), line('60', days.map(() => 60), 'rgba(16,185,129,.5)', [4, 4]), line('100', days.map(() => 100), 'rgba(16,185,129,.5)', [4, 4])] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { ...baseScales('bpm'), y: { ...baseScales('bpm').y, suggestedMin: 50, suggestedMax: 110 } } } });
}

/* =====================================================================
 *  Module G: Trainers & Coaching, Diet Suggestions, Interactive Guide
 * ===================================================================== */
const COACH_KEY = 'miyeefit_pro_coach';
const TOUR_KEY = 'miyeefit_pro_tour';
const DAY_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const isTrainer = () => !!(session && session.user.role === 'trainer');
const isMember = () => !!(session && session.user.role !== 'trainer');
const initial = (n) => esc(String(n || '?').trim().charAt(0).toUpperCase() || '?');

let coach = loadCoachCache();
let trainersCache = null;
let planCtx = null; // plan in effect while a trainer views a client
const trainerUi = { clients: null, detail: null, draft: null, loading: false, profile: null };

function loadCoachCache() {
  try { const c = JSON.parse(localStorage.getItem(COACH_KEY) || 'null'); if (c && session && c.uid === session.user.id) return c; } catch (e) { /* ignore */ }
  return { uid: null, trainer: null, plan: null, messages: [], unread: 0, fetchedAt: null };
}
function saveCoachCache() { try { localStorage.setItem(COACH_KEY, JSON.stringify(coach)); } catch (e) { /* ignore */ } }
function resetCoach() { coach = { uid: null, trainer: null, plan: null, messages: [], unread: 0, fetchedAt: null }; trainersCache = null; try { localStorage.removeItem(COACH_KEY); } catch (e) { /* ignore */ } }
function activePlan() { return planCtx || (isMember() && coach.uid === session.user.id ? coach.plan : null); }
function coachTargets() { const p = activePlan(); return (p && p.targets) || {}; }

async function loadCoach({ read = false, quiet = true } = {}) {
  if (!isMember()) return;
  try {
    const r = await api('/api/coach' + (read ? '?read=1' : ''));
    const hadTrainer = coach.trainer && coach.trainer.id;
    const planChanged = JSON.stringify((coach.plan || {}).updatedAt) !== JSON.stringify((r.plan || {}).updatedAt);
    coach = { uid: session.user.id, trainer: r.trainer, plan: r.plan, messages: r.messages || [], unread: read ? 0 : r.unread, fetchedAt: new Date().toISOString() };
    saveCoachCache();
    if (r.trainerRemoved && hadTrainer) toast('Your trainer is no longer available. Choose a new one in My Coach.', 'warn');
    renderNav();
    if (planChanged && !quiet) toast('Your coach updated your plan', 'info');
    if (planChanged || ui.view === 'coach') { renderHeader(); renderView(); }
  } catch (e) { if (!quiet) toast(e.message, 'error'); }
}
async function loadTrainers() {
  try { const r = await api('/api/trainers'); trainersCache = r.trainers || []; }
  catch (e) { if (trainersCache === null) trainersCache = []; }
  return trainersCache;
}
async function chooseTrainer(id) {
  if (!isMember()) return toast('Sign in as a member to choose a trainer', 'warn');
  if (!id && coach.trainer && !(await confirmDialog({ title: 'Remove trainer', message: `Stop working with <b>${esc(coach.trainer.name)}</b>? They will no longer see your progress, and their targets and exercise plan will be removed from your app.`, confirmText: 'Remove trainer', danger: true }))) { if (ui.view === 'profile') renderProfile(); return; }
  try {
    const r = await api('/api/me/trainer', { method: 'PUT', body: { trainerId: id || null } });
    session.user = r.user; storeSession();
    await loadCoach();
    toast(id ? `${r.trainer.name} is now your coach. They can see your progress.` : 'Trainer removed', id ? 'success' : 'info');
    renderAll();
  } catch (e) { toast(e.message, 'error'); if (ui.view === 'profile') renderProfile(); }
}

/* ---------- Exercise check-offs (stored in the day's log, so trainers see them) ---------- */
function exercisesFor(date, plan = activePlan()) {
  if (!plan || !plan.exercises) return [];
  if (plan.startedAt && date < plan.startedAt.slice(0, 10)) return [];
  const dow = parseYmd(date).getDay();
  return plan.exercises.filter((e) => !e.days.length || e.days.includes(dow));
}
function toggleExerciseDone(id) {
  const l = ensureLog(ui.date);
  l.done = l.done.includes(id) ? l.done.filter((x) => x !== id) : [...l.done, id];
  const ex = (activePlan() || { exercises: [] }).exercises.find((e) => e.id === id);
  pruneLog(ui.date); refresh();
  if (ex && l.done.includes(id)) toast(`${ex.name} done ✅`);
}

/* ---------- Chat ---------- */
function messagesHtml(messages, me, emptyText) {
  if (!messages || !messages.length) return `<div class="rounded-xl border border-dashed border-amber-200 p-6 text-center text-sm muted dark:border-white/10">${emptyText}</div>`;

  }).join('');
}
function chatBox(id, placeholder, onSend) {
  return `<div class="mt-3 flex items-end gap-2"><textarea id="${id}" rows="2" maxlength="2000" class="input resize-none" placeholder="${placeholder}" onkeydown="if(event.key==='Enter'&&(event.ctrlKey||event.metaKey)){event.preventDefault();${onSend}}"></textarea><button class="btn btn-primary !h-[52px]" onclick="${onSend}" aria-label="Send"><i class="fa-solid fa-paper-plane"></i></button></div><div class="mt-1 text-[10px] muted">Ctrl + Enter to send</div>`;

async function memberSend() {
  const el = $('coachMsg'); const text = (el.value || '').trim(); if (!text) return;
  el.disabled = true;
  try { const r = await api('/api/coach/messages', { method: 'POST', body: { text } }); coach.messages = r.messages; saveCoachCache(); renderCoach(); setTimeout(() => { const t = $('coachThread'); if (t) t.scrollTop = t.scrollHeight; }, 30); }
  catch (e) { el.disabled = false; toast(e.message, 'error'); }
}

}

async function openClient(id) {
  ui.clientId = id; trainerUi.detail = null; trainerUi.draft = null;
  go('client');
  try {
    const r = await api(`/api/trainer/clients/${id}?read=1`);
    let data = null;
    if (r.vault && r.vault.data) { try { data = sanitizeState(r.vault.data); } catch (e) { data = null; } }
    trainerUi.detail = { ...r, data };
    const p = r.plan || { targets: {}, exercises: [], note: '' };
    trainerUi.draft = JSON.parse(JSON.stringify({ targets: p.targets || {}, exercises: p.exercises || [], note: p.note || '' }));
    const c = (trainerUi.clients || []).find((x) => x.id === id); if (c) c.unread = false;
    renderNav();
  } catch (e) { toast(e.message, 'error'); trainerUi.detail = { error: e.message }; }

}

/* ---------- Realistic next-meal suggestion ---------- */
const MEAL_SHARE = { early: 0.06, breakfast: 0.25, lunch: 0.32, snack: 0.12, dinner: 0.25 };
const LIGHT_OPTIONS = [[['green_salad', 1], ['buttermilk', 1]], [['veg_soup', 1]], [['green_tea', 1], ['makhana', 0.5]], [['papaya', 1]]];
const dietOk = (f) => state.profile.dietType !== 'jain' || f.tags.includes('j');
function allowedTemplates() { return state.profile.dietType === 'jain' ? PLAN_TEMPLATES.filter((t) => t.jain) : PLAN_TEMPLATES; }
function nextMealSuggestion(date = ui.date) {
  const t = targets(), s = daySummary(date), log = getLog(date);
  const order = ['early', 'breakfast', 'lunch', 'snack', 'dinner'];
  const isToday = date === todayStr();
  const hour = new Date().getHours() + new Date().getMinutes() / 60;
  const logged = new Set(log.foods.map((f) => f.meal));
  const open = order.filter((m) => !logged.has(m));
  if (!open.length) return { done: true };
  const hourOf = (m) => MEALS.find((x) => x.id === m).hour;
  let meal = isToday ? open.find((m) => hourOf(m) + 2.5 >= hour) : open[0];
  if (!meal) return { done: true };
  const rest = open.filter((m) => order.indexOf(m) >= order.indexOf(meal));
  const remKcal = Math.max(0, t.kcal - s.intake), remP = Math.max(0, t.proteinMin - s.p);
  const shareSum = sum(rest, (m) => MEAL_SHARE[m]) || 1;
  const budget = remKcal * MEAL_SHARE[meal] / shareSum, pBudget = remP * MEAL_SHARE[meal] / shareSum;
  const build = (opt, tplName) => {
    const items = opt.map(([fid, q]) => ({ food: findFood(fid), qty: q })).filter((x) => x.food && dietOk(x.food));
    if (!items.length || items.length < opt.length) return null;
    const base = sum(items, (i) => i.food.kcal * i.qty) || 1;
    const factor = budget > 60 ? clamp(budget / base, 0.6, 1.6) : 1;
    items.forEach((i) => { i.qty = Math.max(0.5, Math.round(i.qty * factor * 2) / 2); });
    const kcal = sum(items, (i) => i.food.kcal * i.qty), p = sum(items, (i) => i.food.p * i.qty);
    return { items, kcal, p, tplName };
  };
  let options = [];
  if (remKcal < 120) options = LIGHT_OPTIONS.map((o) => build(o, 'Light & filling')).filter(Boolean);
  else allowedTemplates().forEach((tp) => (tp.meals[meal] || []).forEach((o) => { const b = build(o, tp.name); if (b) options.push(b); }));
  const seen = new Set();
  options = options.filter((o) => { const k = o.items.map((i) => i.food.id).sort().join('|'); if (seen.has(k)) return false; seen.add(k); return true; })
    .map((o) => ({ ...o, fit: Math.abs(o.kcal - budget) / Math.max(80, budget) + Math.max(0, pBudget - o.p) / Math.max(10, pBudget) * 0.8 }))
    .sort((a, b) => a.fit - b.fit).slice(0, 3);
  return { meal, budget, remKcal, remP, pBudget, options, light: remKcal < 120 };
}

      <div class="mt-2 text-[11px] muted"><b class="text-emerald-600 dark:text-emerald-400">${fmt(o.kcal)} kcal</b> • ${r1(o.p)} g protein • ${esc(o.tplName)}</div>
      <button class="btn btn-outline btn-sm mt-2" onclick="addSuggestion(${i})"><i class="fa-solid fa-plus"></i>Add to ${mealName(sg.meal)}</button></div>`).join('') || '<div class="text-sm muted">No matching meals found.</div>'}</div>`;

}
function tourNav(d) { if (!tour) return; tour.i += d; if (tour.i >= tour.steps.length) return endTour(); tour.i = Math.max(0, tour.i); showTourStep(); }
function showTourStep() {
  const step = tour.steps[tour.i];
  if (ui.view !== step.view) go(step.view);
  setTimeout(() => {
    if (!tour) return;
    let el = document.querySelector(step.sel);
    if (el && el.offsetParent === null && step.sel === '#scoreBadge') el = null;
    if (el) el.scrollIntoView({ block: 'center', behavior: 'instant' });
    setTimeout(() => positionTour(el, step), 60);
  }, 260);
}
function positionTour(el, step) {
  if (!tour) return;
  const spot = $('tourSpot'), pop = $('tourPop');
  const vw = window.innerWidth, vh = window.innerHeight;
  const r = el && el.offsetParent !== null ? el.getBoundingClientRect() : null;
  if (r && r.width) {
    const pad = 6, top = Math.max(4, r.top - pad), height = Math.min(r.height + pad * 2, vh - top - 4);
    Object.assign(spot.style, { display: 'block', left: r.left - pad + 'px', top: top + 'px', width: r.width + pad * 2 + 'px', height: height + 'px' });
  } else Object.assign(spot.style, { display: 'block', left: vw / 2 + 'px', top: vh / 2 + 'px', width: '0px', height: '0px' });
  const n = tour.steps.length;
  pop.innerHTML = `<div class="text-[11px] font-bold uppercase tracking-widest text-amber-600">Step ${tour.i + 1} of ${n}</div>
    <div class="mt-1 text-lg font-extrabold text-zinc-900 dark:text-white">${esc(step.title)}</div>
    <p class="mt-1 text-sm leading-relaxed text-zinc-600 dark:text-zinc-300">${esc(step.body)}</p>
    <div class="mt-3 flex gap-1">${tour.steps.map((_, i) => `<span class="h-1.5 flex-1 rounded-full ${i <= tour.i ? 'bg-amber-500' : 'bg-amber-100 dark:bg-white/10'}"></span>`).join('')}</div>
    <div class="mt-4 flex items-center justify-between gap-2"><button class="btn btn-ghost btn-sm" onclick="endTour()">Skip tour</button>
      <div class="flex gap-2">${tour.i ? '<button class="btn btn-soft btn-sm" onclick="tourNav(-1)"><i class="fa-solid fa-arrow-left"></i>Back</button>' : ''}<button class="btn btn-primary btn-sm" onclick="tourNav(1)">${tour.i === n - 1 ? 'Finish' : 'Next'}<i class="fa-solid fa-arrow-right"></i></button></div></div>`;
  const pw = Math.min(360, vw - 24);
  pop.style.width = pw + 'px';
  const ph = pop.offsetHeight || 220;
  let left, top;
  if (r && r.width) {
    left = clamp(r.left + r.width / 2 - pw / 2, 12, vw - pw - 12);
    top = r.bottom + 14 + ph < vh ? r.bottom + 14 : r.top - 14 - ph > 0 ? r.top - 14 - ph : vh - ph - 12;
  } else { left = (vw - pw) / 2; top = (vh - ph) / 2; }
  Object.assign(pop.style, { left: left + 'px', top: Math.max(12, top) + 'px' });
}
window.addEventListener('resize', () => { if (tour) showTourStep(); });

function renderGuide() {
  const trainer = isTrainer();
  const sec = (icon, title, items) => `<details class="card card-pad group" ${title.startsWith('Getting') ? 'open' : ''}><summary class="flex cursor-pointer list-none items-center gap-3 font-extrabold"><span class="flex h-9 w-9 items-center justify-center rounded-xl bg-amber-100 text-amber-600 dark:bg-amber-400/10"><i class="fa-solid ${icon}"></i></span>${title}<i class="fa-solid fa-chevron-down ml-auto text-xs muted transition group-open:rotate-180"></i></summary><ol class="mt-4 list-decimal space-y-2 pl-6 text-sm leading-relaxed text-zinc-600 dark:text-zinc-300">${items.map((x) => `<li>${x}</li>`).join('')}</ol></details>`;
  const member = [
    sec('fa-rocket', 'Getting started', ['Create an account (or continue without one to keep data on this device only).', 'Open <b>Profile</b> and enter your age, height, current and target weight, and choose <b>Pure Vegetarian</b> or <b>Jain</b>.', 'Your calorie, protein, water and step targets are calculated automatically.', 'Optional: choose a trainer in Profile or My Coach.', 'Use <b>Load Sample 14-Day History</b> on an empty account to explore the app with demo data.']),
    sec('fa-list-check', 'Logging your day', ['Pick the date at the top (Prev, Today, Next or the calendar).', 'On the Dashboard, tap +500 / +1,000 steps and +250 ml water as you go.', 'In <b>Daily Tracker</b>, search a food, choose the meal and quantity, and press +.', 'Log workouts with activity, minutes and intensity; calories are calculated for you.', 'Each morning, save your weight, waist, sleep and energy in the check-in.']),
    sec('fa-bowl-food', 'Diet suggestions & Jain option', ['The Dashboard suggests a realistic next meal that fits the calories and protein you have left.', 'Set <b>Diet preference</b> to Jain in Profile to see only Jain-friendly food (no onion, garlic or root vegetables) in suggestions and plans.', 'In <b>Veg Diet Planner</b>, choose a plan, pick your calorie level, swap meals you do not like, and add a meal or the whole day to your log.', 'The cheat sheet ranks the best vegetarian protein and fibre sources per 100 kcal.']),
    sec('fa-wand-magic-sparkles', 'Score & Scope of Improvement', ['Your Daily Fitness Score (0 to 100) appears in the header.', 'Open <b>Scope of Improvement</b> to see red, amber and green audits with exact fixes.', 'Short on protein? Tap a suggested food to add it instantly.', 'Use the 7-day table and score trend to spot patterns.']),
    sec('fa-user-tie', 'Working with your trainer', ['Choose a trainer in <b>Profile</b> or <b>My Coach</b>. If none are listed yet, the list stays empty.', 'Your trainer sees your logged progress and can set your steps, cardio, water, calories and protein.', 'Targets set by your coach show "Set by coach" and are locked; anything they leave blank you set yourself in Profile.', 'Tick off exercises in <b>My Coach</b> each day; your coach sees what you completed.', 'Read your coach\'s instructions and message them from My Coach. You can change or remove your coach any time.']),
    sec('fa-stethoscope', 'Blood pressure & pulse', ['Open <b>Blood Pressure</b> and choose <b>Morning</b> or <b>Evening</b>.', 'Enter systolic (top number), diastolic (bottom number) and pulse, then save. Take 2 readings 1 minute apart and log both.', 'Each reading is classified by ISH 2020 and ACC/AHA 2017; pulse is checked against the normal 60 to 100 bpm range.', 'The analysis shows your 7-day home average against the 135/85 home threshold, morning vs evening, trend, variability, pulse pressure and exercise-day effect.', 'Blood pressure is shown in Scope of Improvement but does not change your Fitness Score. Always confirm high readings with your doctor.']),
    sec('fa-download', 'Install on your phone or laptop', ['Chrome or Edge on a laptop: click the install icon in the address bar, or use the <b>Install app</b> button in the sidebar.', 'Android: open the browser menu and tap <b>Install app</b> or <b>Add to Home screen</b>.', 'iPhone or iPad: in Safari tap <b>Share</b>, then <b>Add to Home Screen</b>.', 'The installed app opens in its own window, works offline and keeps your sign-in and data.']),
    sec('fa-cloud', 'Sync, backups & privacy', ['When signed in, every change saves on this device and to your cloud account automatically.', 'Sign in on another device with the same email to get your data there.', 'Export a JSON backup or CSV report from <b>Data Vault</b> at any time.', 'Passwords cannot be recovered, so keep a backup and remember your password.'])
  ];
  const coachSecs = [
    sec('fa-rocket', 'Getting started as a coach', ['Create an account and choose <b>Trainer / Coach</b>.', 'Complete your <b>Trainer Profile</b>: specialization, experience, certifications, languages, city and bio.', 'Members find you in their Profile or My Coach page and choose you as their coach.', 'Turn off <b>Accepting new clients</b> when you are fully booked.']),
    sec('fa-chart-line', 'Following client progress', ['Open <b>Clients</b> and pick a member.', 'See weight trend, Fitness Score, average intake, steps, water, protein and cardio.', 'Today\'s audit shows exactly where the member is falling short.', 'The 7-day table shows what they logged each day, including exercises completed.']),
    sec('fa-bullseye', 'Setting targets & exercises', ['In the client page, enter daily targets for steps, cardio, water, calories and protein. Leave a box blank to let the member set it.', 'Add exercises from presets (Walking plan, Home strength, Fat-loss circuit, Yoga & mobility) or create custom ones.', 'Pick the weekdays for each exercise; no day picked means every day.', 'Write instructions; they appear at the top of the member\'s My Coach page.', 'Press <b>Save plan</b>. The member sees it the next time they open the app.']),
    sec('fa-comments', 'Messaging', ['Use the Messages panel on the client page to send instructions or encouragement.', 'A red dot on the client list means a new message from that member.'])
  ];
  $('view-guide').innerHTML = `<div class="fade-in space-y-5">
    <div class="overflow-hidden rounded-3xl grad-amber p-6 text-white sm:p-8">
      <div class="text-xs font-bold uppercase tracking-widest opacity-80">User Guide</div>
      <h1 class="mt-1 text-3xl font-extrabold">How to use MiyeeFit Pro${trainer ? ' as a coach' : ''}</h1>
      <p class="mt-2 max-w-xl text-white/90">${trainer ? 'Follow your clients, set their targets and workouts, and keep them motivated.' : 'Track food, steps, water, workouts and weight, get realistic vegetarian or Jain diet suggestions, and work with a trainer.'}</p>
      <div class="mt-4 flex flex-wrap gap-2"><button class="btn bg-white font-bold text-amber-700 hover:bg-amber-50" onclick="startTour()"><i class="fa-solid fa-play"></i>Start interactive tour</button>${isStandalone() ? '' : '<button class="btn border border-white/60 font-bold text-white hover:bg-white/10" onclick="installApp()"><i class="fa-solid fa-download"></i>Install the app</button>'}</div>
    </div>
    <div class="grid grid-cols-1 gap-4 lg:grid-cols-2" data-tour="${trainer ? 'trainer-guide' : 'guide'}">${(trainer ? coachSecs : member).join('')}</div>
  </div>`;
}

/* ---------- Install as an app (PWA) ---------- */
let deferredInstall = null;
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || window.matchMedia('(display-mode: window-controls-overlay)').matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const canOfferInstall = () => /^https?:$/.test(location.protocol) && !isStandalone() && (!!deferredInstall || isIOS());
function renderInstallUi() {
  const b = $('installBtn'); if (b) b.classList.toggle('hidden', isStandalone() || !/^https?:$/.test(location.protocol));
  renderBanner();
  if (ui.view === 'vault' && $('installCard')) $('installCard').innerHTML = installCardHtml();
}
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredInstall = e; renderInstallUi(); });
window.addEventListener('appinstalled', () => { deferredInstall = null; toast('MiyeeFit Pro is installed. Open it from your home screen or app list.'); renderInstallUi(); });
async function installApp() {
  if (deferredInstall) {
    deferredInstall.prompt();
    try { await deferredInstall.userChoice; } catch (e) { /* ignore */ }
    deferredInstall = null; renderInstallUi();
    return;
  }
  showInstallHelp();
}
function showInstallHelp() {
  const ua = navigator.userAgent;
  const platform = isIOS() ? 'ios' : /android/i.test(ua) ? (/samsungbrowser/i.test(ua) ? 'samsung' : /firefox/i.test(ua) ? 'firefox' : 'android') : /edg\//i.test(ua) ? 'edge' : /safari/i.test(ua) && !/chrome/i.test(ua) ? 'mac' : 'chrome';
  const steps = {
    ios: ['iPhone / iPad (Safari)', ['Tap the <b>Share</b> button (square with an arrow).', 'Scroll and tap <b>Add to Home Screen</b>.', 'Tap <b>Add</b>. MiyeeFit opens full screen from your Home Screen.']],
    android: ['Android (Chrome)', ['Tap the <b>⋮</b> menu at the top right.', 'Tap <b>Install app</b> (or <b>Add to Home screen</b>).', 'Tap <b>Install</b>.']],
    samsung: ['Samsung Internet', ['Tap the <b>☰</b> menu.', 'Tap <b>Add page to</b>, then <b>Home screen</b>.', 'Tap <b>Add</b>.']],
    firefox: ['Firefox for Android', ['Tap the <b>⋮</b> menu.', 'Tap <b>Install</b> (or <b>Add to Home screen</b>).']],
    chrome: ['Chrome on Windows, Mac, Linux or ChromeOS', ['Click the <b>install icon</b> at the right end of the address bar.', 'Or open the <b>⋮</b> menu, then <b>Cast, save and share</b>, then <b>Install page as app</b>.', 'Click <b>Install</b>. MiyeeFit gets its own window and a shortcut in your apps.']],
    edge: ['Microsoft Edge', ['Click the <b>App available</b> icon in the address bar.', 'Or open the <b>⋯</b> menu, then <b>Apps</b>, then <b>Install this site as an app</b>.', 'Click <b>Install</b>.']],
    mac: ['Safari on Mac', ['Open the <b>File</b> menu (or the Share button).', 'Choose <b>Add to Dock</b>.', 'Click <b>Add</b>.']]
  };
  const order = [platform, ...Object.keys(steps).filter((k) => k !== platform)];
  openModal('<i class="fa-solid fa-download text-amber-500"></i> Install MiyeeFit Pro', `
    <p class="text-sm muted">Installing gives you an app icon, a full-screen window and offline access. Your data and sign-in stay the same.</p>
    <div class="mt-4 space-y-3">${order.map((k, i) => `<div class="rounded-xl border ${i === 0 ? 'border-amber-400 bg-amber-50 dark:bg-amber-400/10' : 'border-amber-100 dark:border-white/5'} p-3"><div class="text-sm font-bold">${steps[k][0]}${i === 0 ? ' <span class="pill pill-amber">Your browser</span>' : ''}</div><ol class="mt-1 list-decimal space-y-0.5 pl-5 text-sm muted">${steps[k][1].map((x) => `<li>${x}</li>`).join('')}</ol></div>`).join('')}</div>`);
}
function installCardHtml() {
  if (isStandalone()) return '<div class="h-title"><i class="fa-solid fa-mobile-screen mr-1 text-amber-500"></i>App installed</div><p class="mt-2 text-sm muted">You are using the installed app. It works offline and opens from your home screen or app list.</p>';
  return `<div class="h-title"><i class="fa-solid fa-download mr-1 text-amber-500"></i>Install the app</div>
    <p class="mt-2 text-sm muted">Install MiyeeFit Pro on your phone, tablet or laptop from Chrome, Edge, Safari, Samsung Internet or Firefox. You get an app icon, a full-screen window and offline access.</p>
    <div class="mt-3 flex flex-wrap gap-2"><button class="btn btn-primary" onclick="installApp()"><i class="fa-solid fa-download"></i>${deferredInstall ? 'Install now' : 'How to install'}</button>${deferredInstall ? '<button class="btn btn-soft" onclick="showInstallHelp()">Other devices</button>' : ''}</div>`;
}
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch((e) => console.warn('Service worker registration failed', e)); });
}

/* ---------- Boot ---------- */
function applyTheme() { document.documentElement.classList.toggle('dark', state.settings.theme === 'dark'); }
function renderAll() { renderHeader(); renderAccountBtn(); renderBanner(); renderNav(); go(ui.view); }

window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (v && v !== ui.view) go(v); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && tour) endTour();
  else if (e.key === 'Escape' && !$('modal').classList.contains('hidden')) closeModal();
  else if (e.key === 'Escape' && !$('authScreen').classList.contains('hidden') && !authUi.gate) closeAuth(false);
  if (e.target.matches('input, select, textarea')) return;
  if (e.key === 'ArrowLeft' && e.altKey) shiftDate(-1);
  if (e.key === 'ArrowRight' && e.altKey) shiftDate(1);
});
window.addEventListener('storage', (e) => {
  if (e.key === SESSION_KEY) { session = loadSession(); renderAll(); if (!session && cloud.available) openAuth('login', { gate: true }); else closeAuth(false); return; }
  if (e.key === STORAGE_KEY && e.newValue) { try { state = sanitizeState(JSON.parse(e.newValue)); applyTheme(); renderAll(); } catch (err) { /* ignore foreign writes */ } } });
document.addEventListener('visibilitychange', () => { if (!document.hidden && session && Date.now() - cloud.lastPullCheck > 30000) { cloud.lastPullCheck = Date.now(); if (isTrainer()) loadClients(); else pullVault(); } });
window.addEventListener('online', () => { if (session) { if (cloud.dirty) pushVault(); else pullVault(); } });
let lastDay = todayStr();
setInterval(() => {
  const t = todayStr();
  if (t !== lastDay) { if (ui.date === lastDay) ui.date = t; lastDay = t; renderAll(); }
  else renderSyncIndicator();
}, 60000);

(function boot() {
  applyTheme();
  const v = location.hash.slice(1);
  ui.view = currentViews().some((x) => x.id === v && x.id !== 'client') ? v : currentViews()[0].id;
  if (!localStorage.getItem(STORAGE_KEY)) save({ skipSync: true });
  if (typeof Chart === 'undefined') console.warn('Chart.js failed to load. Charts are disabled; all other features work offline.');
  renderAll();
  renderInstallUi();
  checkCloud().then((available) => {
    renderAccountBtn(); renderSyncIndicator();
    if (ui.view === 'vault' && $('cloudCard')) $('cloudCard').innerHTML = cloudCardHtml();
    if (isTrainer()) loadClients();
    else if (session) pullVault();
    else if (available && !state.settings.authSkipped) { openAuth('login', { gate: true }); return; }
    maybeAutoTour();
  });
})();
</script>
